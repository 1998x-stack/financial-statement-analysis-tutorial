<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 420" role="img" aria-labelledby="f06dep-title f06dep-desc"><title id="f06dep-title">折旧期限比较的利润敏感性</title><desc id="f06dep-desc">成本1000万、残值零、直线法，初始估计10年每年折旧100万，初始估计20年每年折旧50万，税前利润差50万，单纯估计不改变经营收现</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6" fill="none" stroke="#147f79" stroke-width="1.5"/></marker></defs><rect width="840" height="420" rx="16" fill="#fffefa"/><text x="30" y="43" text-anchor="start" font-family="system-ui, sans-serif" font-size="21" font-weight="650" fill="#183c3a">同样 1,000 万元资产：两种寿命估计的对比</text><text x="30" y="74" text-anchor="start" font-family="system-ui, sans-serif" font-size="14" font-weight="500" fill="#4e6866">假设初始计量、残值零、直线法、完整年度、无减值和所得税影响</text><rect x="30" y="106" width="376" height="234" rx="10" fill="#eff7f2" stroke="#147f79" stroke-width="1.7"/><rect x="433" y="106" width="376" height="234" rx="10" fill="#fcf0e8" stroke="#bb7545" stroke-width="1.7"/><text x="53" y="146" text-anchor="start" font-family="system-ui, sans-serif" font-size="20" font-weight="650" fill="#147f79">预计使用 10 年</text><text x="456" y="146" text-anchor="start" font-family="system-ui, sans-serif" font-size="20" font-weight="650" fill="#bb7545">预计使用 20 年</text><text x="53" y="183" text-anchor="start" font-family="system-ui, sans-serif" font-size="19" font-weight="650" fill="#183c3a">年折旧 = 100 万</text><text x="456" y="183" text-anchor="start" font-family="system-ui, sans-serif" font-size="19" font-weight="650" fill="#183c3a">年折旧 = 50 万</text><rect x="56" y="208" width="240" height="40" rx="10" fill="#147f79" stroke="#147f79" stroke-width="1.7"/><rect x="459" y="208" width="120" height="40" rx="10" fill="#bb7545" stroke="#bb7545" stroke-width="1.7"/><text x="53" y="290" text-anchor="start" font-family="system-ui, sans-serif" font-size="18" font-weight="650" fill="#147f79">首年末净值 900</text><text x="456" y="290" text-anchor="start" font-family="system-ui, sans-serif" font-size="18" font-weight="650" fill="#bb7545">首年末净值 950</text><text x="420" y="382" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="500" fill="#183c3a">其他条件相同：税前利润差 50；并不会凭空产生 50 万元现金</text></svg>