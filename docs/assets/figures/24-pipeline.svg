<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 260" role="img" aria-labelledby="t24p d24p">
<title id="t24p">Python 财报分析的五个环节：从数据源到报告</title>
<desc id="d24p">流程为数据源、清洗与口径核对、比率计算、可视化、报告导出。其中口径核对是必须由人确认的环节，因为它决定后续所有比率的分子与分母。</desc>
<rect x="0" y="0" width="840" height="260" fill="#f8f7f2"/>
<text x="40" y="38" font-size="18" font-weight="700" fill="#1a1a1a">脚本只是流水线，口径核对才是关键环节</text>
<g font-size="12.5" text-anchor="middle">
<rect x="26" y="96" width="140" height="70" rx="8" fill="#eef2ed" stroke="#577173"/><text x="96" y="126" fill="#1c3133">数据源</text><text x="96" y="146" font-size="12.5" fill="#577173">报表 / 行情接口</text>
<rect x="184" y="96" width="160" height="70" rx="8" fill="#f9eee5" stroke="#b66a38"/><text x="264" y="122" fill="#b66a38" font-weight="700">清洗 + 口径核对</text><text x="264" y="144" font-size="12.5" fill="#395253">单位 / 期间 / 合并范围</text>
<rect x="362" y="96" width="140" height="70" rx="8" fill="#e8f3ef" stroke="#116d69"/><text x="432" y="126" fill="#116d69">比率计算</text><text x="432" y="146" font-size="12.5" fill="#395253">pandas / 纯函数</text>
<rect x="520" y="96" width="140" height="70" rx="8" fill="#e8f3ef" stroke="#116d69"/><text x="590" y="126" fill="#116d69">可视化</text><text x="590" y="146" font-size="12.5" fill="#395253">趋势 / 对比图</text>
<rect x="678" y="96" width="136" height="70" rx="8" fill="#f1eef9" stroke="#6657a0"/><text x="746" y="126" fill="#6657a0">报告导出</text><text x="746" y="146" font-size="12.5" fill="#395253">表格 / 文档</text>
</g>
<g stroke="#577173" stroke-width="1.5" marker-end="url(#a24)">
<line x1="166" y1="131" x2="182" y2="131"/><line x1="344" y1="131" x2="360" y2="131"/><line x1="502" y1="131" x2="518" y2="131"/><line x1="660" y1="131" x2="676" y2="131"/>
</g>
<defs><marker id="a24" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#577173"/></marker></defs>
<path d="M264,166 C264,212 432,212 432,168" fill="none" stroke="#b66a38" stroke-width="1.6" stroke-dasharray="6 4"/>
<text x="348" y="228" font-size="12.5" fill="#b66a38" text-anchor="middle">口径错了，后面算得再快也是错的</text>
<text x="40" y="252" font-size="12.5" fill="#555">图注：库名、接口与字段会随版本变化，图与正文只讲流程，不保证任何具体函数名长期可用。</text>
</svg>
