<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 360" role="img" aria-labelledby="t21a d21a">
<title id="t21a">四个行业各自的关键财务指标类别对照</title>
<desc id="d21a">银行、科技、制造业、消费四个行业在核心盈利、风险、资产与常用估值四类指标上各有侧重：银行看净息差、不良与拨备、资本充足率；科技看毛利率与研发资本化；制造业看产能利用率、固定资产周转与原材料成本；消费看同店增长、渠道库存与毛利率稳定性。</desc>
<rect x="0" y="0" width="840" height="360" fill="#f8f7f2"/>
<text x="40" y="36" font-size="18" font-weight="700" fill="#1a1a1a">同一个数字，在不同行业含义不同</text>
<g font-size="12.5" text-anchor="middle">
<rect x="40" y="56" width="180" height="34" fill="#116d69"/><text x="130" y="78" fill="#fff" font-size="14">维度</text>
<rect x="220" y="56" width="150" height="34" fill="#116d69"/><text x="295" y="78" fill="#fff" font-size="14">银行</text>
<rect x="370" y="56" width="150" height="34" fill="#116d69"/><text x="445" y="78" fill="#fff" font-size="14">科技</text>
<rect x="520" y="56" width="150" height="34" fill="#116d69"/><text x="595" y="78" fill="#fff" font-size="14">制造业</text>
<rect x="670" y="56" width="150" height="34" fill="#116d69"/><text x="745" y="78" fill="#fff" font-size="14">消费</text>
</g>
<g font-size="12" text-anchor="middle" fill="#1c3133">
<rect x="40" y="90" width="180" height="56" fill="#eef2ed"/><text x="130" y="123">核心盈利</text>
<rect x="220" y="90" width="150" height="56" fill="#f5f7f4"/><text x="295" y="116">净息差 NIM</text><text x="295" y="134">ROA</text>
<rect x="370" y="90" width="150" height="56" fill="#f5f7f4"/><text x="445" y="123">毛利率、ARPU</text>
<rect x="520" y="90" width="150" height="56" fill="#f5f7f4"/><text x="595" y="123">产能利用率</text>
<rect x="670" y="90" width="150" height="56" fill="#f5f7f4"/><text x="745" y="123">同店销售增长</text>
<rect x="40" y="146" width="180" height="70" fill="#eef2ed"/><text x="130" y="186">核心风险</text>
<rect x="220" y="146" width="150" height="70" fill="#fbeee9"/><text x="295" y="176">不良贷款率</text><text x="295" y="194">拨备覆盖率</text>
<rect x="370" y="146" width="150" height="70" fill="#fbeee9"/><text x="445" y="176">研发资本化率</text><text x="445" y="194">客户集中度</text>
<rect x="520" y="146" width="150" height="70" fill="#fbeee9"/><text x="595" y="176">原材料成本占比</text><text x="595" y="194">产能过剩</text>
<rect x="670" y="146" width="150" height="70" fill="#fbeee9"/><text x="745" y="176">渠道库存</text><text x="745" y="194">毛利率波动</text>
<rect x="40" y="216" width="180" height="56" fill="#eef2ed"/><text x="130" y="249">资产与资本</text>
<rect x="220" y="216" width="150" height="56" fill="#f5f7f4"/><text x="295" y="249">资本充足率</text>
<rect x="370" y="216" width="150" height="56" fill="#f5f7f4"/><text x="445" y="242">无形资产、商誉</text><text x="445" y="260">研发人员</text>
<rect x="520" y="216" width="150" height="56" fill="#f5f7f4"/><text x="595" y="242">固定资产周转率</text><text x="595" y="260">折旧政策</text>
<rect x="670" y="216" width="150" height="56" fill="#f5f7f4"/><text x="745" y="242">存货周转率</text><text x="745" y="260">坪效</text>
<rect x="40" y="272" width="180" height="56" fill="#eef2ed"/><text x="130" y="305">常用估值</text>
<rect x="220" y="272" width="150" height="56" fill="#f5f7f4"/><text x="295" y="305">PB 及历史分位</text>
<rect x="370" y="272" width="150" height="56" fill="#f5f7f4"/><text x="445" y="305">PS、PEG</text>
<rect x="520" y="272" width="150" height="56" fill="#f5f7f4"/><text x="595" y="305">EV/EBITDA</text>
<rect x="670" y="272" width="150" height="56" fill="#f5f7f4"/><text x="745" y="305">PE、PEG</text>
</g>
<text x="40" y="350" font-size="12" fill="#555">图注：表中的“关键指标”是经验性的分析起点，不含统一阈值；具体判断必须结合公司披露、行业周期与监管口径。</text>
</svg>
