<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 380" role="img" aria-labelledby="s06-title s06-desc"><title id="s06-title">收入确认与现金收款分开观察</title><desc id="s06-desc">假设控制权已转移的销售额一千万元，客户当期支付七百五十万元且期初无应收，则新增应收二百五十万元；实际仍需核对税额和合同资产</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#147f79" stroke-width="1.3"/></marker></defs><style>.label{font:700 19px system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}.detail{font:500 15px system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;fill:#526964}.small{font:600 13px system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;fill:#566e69}.number{font:760 26px system-ui,-apple-system,"PingFang SC",sans-serif}.caption{font:700 14px system-ui,-apple-system,"PingFang SC",sans-serif;fill:#173b3a}</style><rect width="840" height="380" fill="#fffefa" rx="16"/><text x="30" y="46" class="label" fill="#173b3a" text-anchor="start">同一个报告期内，收入与收现不必相同</text><rect x="30" y="96" width="243" height="86" rx="12" fill="#fffdfa" stroke="#147f79" stroke-width="2"/><rect x="30" y="96" width="8" height="86" rx="4" fill="#147f79"/><text x="49" y="126" class="label" fill="#173b3a">已确认收入</text><text x="49" y="153" class="detail">1,000 万（权责发生）</text><rect x="299" y="96" width="243" height="86" rx="12" fill="#fffdfa" stroke="#7764aa" stroke-width="2"/><rect x="299" y="96" width="8" height="86" rx="4" fill="#7764aa"/><text x="318" y="126" class="label" fill="#173b3a">本期收到款项</text><text x="318" y="153" class="detail">750 万（假设）</text><rect x="569" y="96" width="243" height="86" rx="12" fill="#fffdfa" stroke="#c17b48" stroke-width="2"/><rect x="569" y="96" width="8" height="86" rx="4" fill="#c17b48"/><text x="588" y="126" class="label" fill="#173b3a">形成应收余额</text><text x="588" y="153" class="detail">250 万（简化）</text><path d="M273 139 L294 139" stroke="#147f79" stroke-width="2.2" fill="none" marker-end="url(#arrow)"/><path d="M542 139 L564 139" stroke="#147f79" stroke-width="2.2" fill="none" marker-end="url(#arrow)"/><rect x="52" y="225" width="737" height="94" rx="10" fill="#eef4f0"/><text x="420" y="260" class="caption" fill="#173b3a" text-anchor="middle">利润表看履约、现金流看收款、资产负债表看待收金额</text><text x="420" y="289" class="small" fill="#5c7773" text-anchor="middle">增速背离只是核查线索：结算季节性与账期变化也能解释差异</text></svg>