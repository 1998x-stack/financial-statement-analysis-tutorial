<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 438" role="img" aria-labelledby="f08dup-title f08dup-desc"><title id="f08dup-title">ROE的三因素分解：利润率、资产周转和权益乘数</title><desc id="f08dup-desc">示例净利润120、收入1000、平均资产1000、平均权益400，ROE等于12%乘1.0再乘2.5等于30%</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6" stroke="#147f79" fill="none" stroke-width="1.5"/></marker></defs><rect width="840" height="438" fill="#fffefa" rx="16"/><text x="30" y="43" font-family="system-ui,-apple-system,'PingFang SC',sans-serif" font-size="21" font-weight="650" text-anchor="start" fill="#1d4040">净资产收益率为什么会高？先把它拆开</text><rect x="25" y="99" width="230" height="168" rx="10" fill="#fffdfa" stroke="#147f79" stroke-width="1.5"/><text x="43" y="140" font-family="system-ui,-apple-system,'PingFang SC',sans-serif" font-size="19" font-weight="650" text-anchor="start" fill="#147f79">销售净利率</text><text x="43" y="185" font-family="system-ui,-apple-system,'PingFang SC',sans-serif" font-size="18" font-weight="650" text-anchor="start" fill="#1d4040">120 / 1,000</text><text x="43" y="237" font-family="system-ui,-apple-system,'PingFang SC',sans-serif" font-size="25" font-weight="650" text-anchor="start" fill="#147f79">12%</text><rect x="305" y="99" width="230" height="168" rx="10" fill="#fffdfa" stroke="#7663a8" stroke-width="1.5"/><text x="323" y="140" font-family="system-ui,-apple-system,'PingFang SC',sans-serif" font-size="19" font-weight="650" text-anchor="start" fill="#7663a8">总资产周转率</text><text x="323" y="185" font-family="system-ui,-apple-system,'PingFang SC',sans-serif" font-size="18" font-weight="650" text-anchor="start" fill="#1d4040">1,000 / 1,000</text><text x="323" y="237" font-family="system-ui,-apple-system,'PingFang SC',sans-serif" font-size="25" font-weight="650" text-anchor="start" fill="#7663a8">1.0 ×</text><rect x="585" y="99" width="230" height="168" rx="10" fill="#fffdfa" stroke="#bc7443" stroke-width="1.5"/><text x="603" y="140" font-family="system-ui,-apple-system,'PingFang SC',sans-serif" font-size="19" font-weight="650" text-anchor="start" fill="#bc7443">权益乘数</text><text x="603" y="185" font-family="system-ui,-apple-system,'PingFang SC',sans-serif" font-size="18" font-weight="650" text-anchor="start" fill="#1d4040">1,000 / 400</text><text x="603" y="237" font-family="system-ui,-apple-system,'PingFang SC',sans-serif" font-size="25" font-weight="650" text-anchor="start" fill="#bc7443">2.5 ×</text><path d="M420 268 L420 302" stroke="#147f79" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="218" y="307" width="404" height="70" rx="10" fill="#e8f3ee" stroke="#147f79" stroke-width="1.5"/><text x="420" y="341" font-family="system-ui,-apple-system,'PingFang SC',sans-serif" font-size="18" font-weight="650" text-anchor="middle" fill="#1d4040">ROE = 12% × 1.0 × 2.5</text><text x="420" y="364" font-family="system-ui,-apple-system,'PingFang SC',sans-serif" font-size="22" font-weight="650" text-anchor="middle" fill="#147f79">= 30%</text><text x="420" y="409" font-family="system-ui,-apple-system,'PingFang SC',sans-serif" font-size="14" font-weight="500" text-anchor="middle" fill="#59736d">口径：净利润与平均总权益；高乘数可能放大风险</text></svg>