<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 420" role="img" aria-labelledby="f07evidence-title f07evidence-desc"><title id="f07evidence-title">收入和应收增长背离时的证据阶梯</title><desc id="f07evidence-desc">收入1000到1200增长20%，应收期末160到300增长87.5%；账期延长、期末销售、并表与收入异常是需要分别验证的假设</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6" fill="none" stroke="#147f79" stroke-width="1.5"/></marker></defs><rect width="840" height="420" rx="16" fill="#fffefa"/><text x="28" y="40" text-anchor="start" font-family="system-ui, sans-serif" font-size="21" font-weight="650" fill="#183c3a">从发现异常到形成可检验结论</text><rect x="74" y="63" width="690" height="55" rx="10" fill="#f0f6f1" stroke="#147f79" stroke-width="1.7"/><rect x="75" y="63" width="142" height="55" rx="10" fill="#147f79" stroke="#147f79" stroke-width="1.7"/><text x="146" y="99" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="500" fill="#fff">观察</text><text x="238" y="99" text-anchor="start" font-family="system-ui, sans-serif" font-size="16" font-weight="500" fill="#183c3a">收入 +20%，期末应收 +87.5%</text><path d="M420 118 L420 130" fill="none" stroke="#147f79" stroke-width="2" marker-end="url(#arrow)"/><rect x="74" y="130" width="690" height="55" rx="10" fill="#f7f8f3" stroke="#7963aa" stroke-width="1.7"/><rect x="75" y="130" width="142" height="55" rx="10" fill="#7963aa" stroke="#7963aa" stroke-width="1.7"/><text x="146" y="166" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="500" fill="#fff">解释 A</text><text x="238" y="166" text-anchor="start" font-family="system-ui, sans-serif" font-size="16" font-weight="500" fill="#183c3a">大量期末交付 → 核对季节性、回款</text><path d="M420 185 L420 197" fill="none" stroke="#147f79" stroke-width="2" marker-end="url(#arrow)"/><rect x="74" y="197" width="690" height="55" rx="10" fill="#f0f6f1" stroke="#bb7545" stroke-width="1.7"/><rect x="75" y="197" width="142" height="55" rx="10" fill="#bb7545" stroke="#bb7545" stroke-width="1.7"/><text x="146" y="233" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="500" fill="#fff">解释 B</text><text x="238" y="233" text-anchor="start" font-family="system-ui, sans-serif" font-size="16" font-weight="500" fill="#183c3a">信用期延长 → 核对合同、账龄</text><path d="M420 252 L420 264" fill="none" stroke="#147f79" stroke-width="2" marker-end="url(#arrow)"/><rect x="74" y="264" width="690" height="55" rx="10" fill="#f7f8f3" stroke="#b25448" stroke-width="1.7"/><rect x="75" y="264" width="142" height="55" rx="10" fill="#b25448" stroke="#b25448" stroke-width="1.7"/><text x="146" y="300" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="500" fill="#fff">解释 C</text><text x="238" y="300" text-anchor="start" font-family="system-ui, sans-serif" font-size="16" font-weight="500" fill="#183c3a">履约证据问题 → 核对交付与对手方</text><path d="M420 319 L420 331" fill="none" stroke="#147f79" stroke-width="2" marker-end="url(#arrow)"/><rect x="74" y="331" width="690" height="55" rx="10" fill="#f0f6f1" stroke="#147f79" stroke-width="1.7"/><rect x="75" y="331" width="142" height="55" rx="10" fill="#147f79" stroke="#147f79" stroke-width="1.7"/><text x="146" y="367" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="500" fill="#fff">结论</text><text x="238" y="367" text-anchor="start" font-family="system-ui, sans-serif" font-size="16" font-weight="500" fill="#183c3a">先证实或排除竞争解释，不直接定性</text></svg>