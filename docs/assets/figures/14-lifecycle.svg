<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 400" width="840" height="400" role="img" aria-labelledby="t14b d14b">
<title id="t14b">行业四个生命周期阶段的典型财务组合</title>
<desc id="d14b">导入期收入基数小增速高、利润为负或微利、经营现金流多为负；成长期收入快速增长、利润率改善、营运资本占用上升；成熟期收入平稳、利润高位稳定、经营现金流充裕；衰退期收入下滑、利润受压、以现金回收为主。每个阶段适合看的指标不同。</desc>
<rect x="0" y="0" width="840" height="400" fill="#fffefa"/>
<text x="30" y="40" font-size="16" font-weight="700" fill="#1c3133">阶段不同，同一组数字的含义不同（经验概括，非准则规定）</text>
<rect x="30" y="60" width="190" height="42" rx="4" fill="#e8f3ef" stroke="#116d69"/>
<text x="125" y="87" text-anchor="middle" font-size="15" fill="#116d69">导入期</text>
<text x="125" y="126" text-anchor="middle" font-size="14" fill="#1c3133">收入：基数小增速高</text>
<text x="125" y="152" text-anchor="middle" font-size="14" fill="#1c3133">利润：为负或微利</text>
<text x="125" y="178" text-anchor="middle" font-size="14" fill="#1c3133">现金流：多为负</text>
<text x="125" y="214" text-anchor="middle" font-size="14" fill="#116d69">看：单位经济性</text>
<rect x="232" y="60" width="190" height="42" rx="4" fill="#e8f3ef" stroke="#116d69"/>
<text x="327" y="87" text-anchor="middle" font-size="15" fill="#116d69">成长期</text>
<text x="327" y="126" text-anchor="middle" font-size="14" fill="#1c3133">收入：快速增长</text>
<text x="327" y="152" text-anchor="middle" font-size="14" fill="#1c3133">利润：利润率改善</text>
<text x="327" y="178" text-anchor="middle" font-size="14" fill="#1c3133">现金流：占用上升</text>
<text x="327" y="214" text-anchor="middle" font-size="14" fill="#116d69">看：营运资本增速</text>
<rect x="434" y="60" width="190" height="42" rx="4" fill="#e8f3ef" stroke="#116d69"/>
<text x="529" y="87" text-anchor="middle" font-size="15" fill="#116d69">成熟期</text>
<text x="529" y="126" text-anchor="middle" font-size="14" fill="#1c3133">收入：平稳</text>
<text x="529" y="152" text-anchor="middle" font-size="14" fill="#1c3133">利润：高位稳定</text>
<text x="529" y="178" text-anchor="middle" font-size="14" fill="#1c3133">现金流：充裕</text>
<text x="529" y="214" text-anchor="middle" font-size="14" fill="#116d69">看：自由现金流</text>
<rect x="636" y="60" width="174" height="42" rx="4" fill="#f9eee5" stroke="#b66a38"/>
<text x="723" y="87" text-anchor="middle" font-size="15" fill="#b66a38">衰退期</text>
<text x="723" y="126" text-anchor="middle" font-size="14" fill="#1c3133">收入：下滑</text>
<text x="723" y="152" text-anchor="middle" font-size="14" fill="#1c3133">利润：受压</text>
<text x="723" y="178" text-anchor="middle" font-size="14" fill="#1c3133">现金流：回收为主</text>
<text x="723" y="214" text-anchor="middle" font-size="14" fill="#b66a38">看：债务到期结构</text>
<line x1="30" y1="248" x2="810" y2="248" stroke="#d9e1db" stroke-width="1.5"/>
<text x="30" y="278" font-size="15" fill="#577173">错位使用会得出错误结论：把导入期的负经营现金流当作经营失败，或把成熟期的平稳增速当作失去竞争力。</text>
<text x="30" y="306" font-size="15" fill="#577173">同一行业内的不同公司可以处在不同阶段；阶段判断需要行业数据与公司自身业务节奏共同支撑。</text>
<text x="30" y="334" font-size="15" fill="#577173">阶段判断本身不能从财务报表单独得出，它是行业分析与公司沟通的结果，属于分析者判断而非披露事实。</text>
<text x="30" y="362" font-size="15" fill="#577173">因此同业比较应写成“位置 + 差异原因 + 待核对证据”三段，而不是一句好坏评价。</text>
<text x="30" y="390" font-size="15" fill="#577173">图中所有描述为教学概括，不对应任何具体行业或年份的真实统计数据。</text>
</svg>
