<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 520" role="img" aria-labelledby="home-map-title home-map-desc"><title id="home-map-title">从一笔交易追踪三张表和附注</title><desc id="home-map-desc">对同一笔交易，分析存量、利润、现金与附注四条证据链，不把孤立指标作为判断依据</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#147f79" stroke-width="1.3"/></marker></defs><style>.label{font:700 19px system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}.detail{font:500 15px system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}.small{font:600 13px system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}.number{font:760 26px system-ui,-apple-system,"PingFang SC",sans-serif}.caption{font:700 14px system-ui,-apple-system,"PingFang SC",sans-serif;fill:#173b3a}</style><rect width="840" height="520" fill="#fffefa" rx="16"/><text x="35" y="51" class="label" fill="#173b3a" text-anchor="start">一笔交易 · 四条验证路径</text><text x="35" y="80" class="detail" fill="#173b3a" text-anchor="start">从报表结果追溯商业事实，才能判断数字是否可信</text><rect x="34" y="122" width="360" height="86" rx="12" fill="#fffdfa" stroke="#147f79" stroke-width="2"/><rect x="34" y="122" width="8" height="86" rx="4" fill="#147f79"/><text x="53" y="152" class="label" fill="#173b3a">资产负债表 · 存量</text><text x="53" y="179" class="detail" fill="#526964">钱在哪里？债务什么时候到期？</text><rect x="443" y="122" width="362" height="86" rx="12" fill="#fffdfa" stroke="#c17b48" stroke-width="2"/><rect x="443" y="122" width="8" height="86" rx="4" fill="#c17b48"/><text x="462" y="152" class="label" fill="#173b3a">利润表 · 期间结果</text><text x="462" y="179" class="detail" fill="#526964">收入如何确认？成本怎样匹配？</text><rect x="34" y="271" width="360" height="86" rx="12" fill="#fffdfa" stroke="#7764aa" stroke-width="2"/><rect x="34" y="271" width="8" height="86" rx="4" fill="#7764aa"/><text x="53" y="301" class="label" fill="#173b3a">现金流量表 · 资金兑现</text><text x="53" y="328" class="detail" fill="#526964">款项何时收回？需要多少再投资？</text><rect x="443" y="271" width="362" height="86" rx="12" fill="#fffdfa" stroke="#ad5248" stroke-width="2"/><rect x="443" y="271" width="8" height="86" rx="4" fill="#ad5248"/><text x="462" y="301" class="label" fill="#173b3a">附注 · 规则与风险</text><text x="462" y="328" class="detail" fill="#526964">资金受限吗？交易方是谁？估计可靠吗？</text><path d="M394 167 L440 167" stroke="#147f79" stroke-width="2.2" fill="none" marker-end="url(#arrow)"/><path d="M624 209 L624 268" stroke="#147f79" stroke-width="2.2" fill="none" marker-end="url(#arrow)"/><path d="M443 317 L398 317" stroke="#147f79" stroke-width="2.2" fill="none" marker-end="url(#arrow)"/><path d="M210 208 L210 268" stroke="#147f79" stroke-width="2.2" fill="none" marker-end="url(#arrow)"/><rect x="173" y="404" width="492" height="73" rx="36" fill="#e9f4ef" stroke="#147f79"/><text x="419" y="435" text-anchor="middle" class="label" fill="#173b3a">交叉核对 → 形成可检验结论</text><text x="419" y="459" text-anchor="middle" class="small">保持口径一致 · 关注比较期间 · 记录反例</text><path d="M210 360 L265 404" stroke="#147f79" stroke-width="2.2" fill="none" marker-end="url(#arrow)"/><path d="M624 360 L575 404" stroke="#147f79" stroke-width="2.2" fill="none" marker-end="url(#arrow)"/></svg>