<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 420" width="840" height="420" role="img" aria-labelledby="t12a d12a">
<title id="t12a">从净利润 1000 万元桥接到经营现金流 560 万元的分解</title>
<desc id="d12a">教学虚构算例：净利润 1000 万元，加回折旧摊销 100 万元，减去应收账款增加 400 万元和存货增加 200 万元，加回应付账款增加 60 万元，得到经营活动现金流量净额 560 万元。净现比为 0.56。</desc>
<rect x="0" y="0" width="840" height="420" fill="#fffefa"/>
<text x="30" y="40" font-size="16" font-weight="700" fill="#1c3133">从利润表桥接到现金流量表（单位：万元，教学虚构）</text>
<line x1="50" y1="340" x2="790" y2="340" stroke="#577173" stroke-width="1.5"/>
<rect x="70" y="121.8" width="90" height="218.2" rx="3" fill="#116d69"/>
<text x="115" y="112" text-anchor="middle" font-size="16" font-weight="700" fill="#116d69">1000</text>
<text x="115" y="372" text-anchor="middle" font-size="15" fill="#1c3133">净利润</text>
<rect x="190" y="100" width="90" height="21.8" rx="3" fill="#2f6d38"/>
<text x="235" y="92" text-anchor="middle" font-size="16" font-weight="700" fill="#2f6d38">+100</text>
<text x="235" y="372" text-anchor="middle" font-size="15" fill="#1c3133">折旧摊销</text>
<rect x="310" y="187.3" width="90" height="87.3" rx="3" fill="#b66a38"/>
<text x="355" y="178" text-anchor="middle" font-size="16" font-weight="700" fill="#b66a38">−400</text>
<text x="355" y="372" text-anchor="middle" font-size="15" fill="#1c3133">应收增加</text>
<rect x="430" y="230.9" width="90" height="43.6" rx="3" fill="#b66a38"/>
<text x="475" y="222" text-anchor="middle" font-size="16" font-weight="700" fill="#b66a38">−200</text>
<text x="475" y="372" text-anchor="middle" font-size="15" fill="#1c3133">存货增加</text>
<rect x="550" y="217.8" width="90" height="13.1" rx="3" fill="#2f6d38"/>
<text x="595" y="210" text-anchor="middle" font-size="16" font-weight="700" fill="#2f6d38">+60</text>
<text x="595" y="372" text-anchor="middle" font-size="15" fill="#1c3133">应付增加</text>
<rect x="670" y="217.8" width="90" height="122.2" rx="3" fill="#116d69"/>
<text x="715" y="208" text-anchor="middle" font-size="16" font-weight="700" fill="#116d69">560</text>
<text x="715" y="372" text-anchor="middle" font-size="15" fill="#1c3133">经营现金流</text>
<line x1="160" y1="121.8" x2="190" y2="121.8" stroke="#577173" stroke-width="1.2" stroke-dasharray="5 4"/>
<line x1="280" y1="100" x2="310" y2="100" stroke="#577173" stroke-width="1.2" stroke-dasharray="5 4"/>
<line x1="400" y1="187.3" x2="430" y2="187.3" stroke="#577173" stroke-width="1.2" stroke-dasharray="5 4"/>
<line x1="520" y1="230.9" x2="550" y2="230.9" stroke="#577173" stroke-width="1.2" stroke-dasharray="5 4"/>
<line x1="640" y1="217.8" x2="670" y2="217.8" stroke="#577173" stroke-width="1.2" stroke-dasharray="5 4"/>
<text x="30" y="388" font-size="15" fill="#577173">净现比 = 560 ÷ 1000 = 0.56；差额 −440 万元由折旧摊销与营运资本变动解释。</text>
<text x="30" y="410" font-size="15" fill="#577173">每一步都需与附注核对；橙色段金额若与披露不符，本图即被证伪。</text>
</svg>
