<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 430" role="img" aria-labelledby="f15chain-title f15chain-desc"><title id="f15chain-title">财务异常信号必须经过竞争假设与独立证据验证</title><desc id="f15chain-desc">观察到增长异常后，列出正常商业解释和舞弊假设，核对合同、履约、客户、物流、资金与期后事项，最后形成有边界的结论</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6" stroke="#147f79" fill="none" stroke-width="1.5"/></marker></defs><rect width="840" height="430" fill="#fffefa" rx="16"/><text x="28" y="42" font-family="system-ui,-apple-system,'PingFang SC',sans-serif" font-size="21" font-weight="650" text-anchor="start" fill="#1d4040">从指标异常，到可以复核的证据链</text><rect x="82" y="68" width="676" height="54" rx="10" fill="#edf5f1" stroke="#147f79" stroke-width="1.5"/><rect x="83" y="68" width="140" height="54" rx="10" fill="#147f79" stroke="#147f79" stroke-width="1.5"/><text x="153" y="102" font-family="system-ui,-apple-system,'PingFang SC',sans-serif" font-size="16" font-weight="500" text-anchor="middle" fill="#fff">观察</text><text x="240" y="102" font-family="system-ui,-apple-system,'PingFang SC',sans-serif" font-size="15" font-weight="500" text-anchor="start" fill="#1d4040">收入增长、应收增长、CFO背离</text><path d="M420 122 L420 133" stroke="#147f79" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="82" y="135" width="676" height="54" rx="10" fill="#f7f8f3" stroke="#7663a8" stroke-width="1.5"/><rect x="83" y="135" width="140" height="54" rx="10" fill="#7663a8" stroke="#7663a8" stroke-width="1.5"/><text x="153" y="169" font-family="system-ui,-apple-system,'PingFang SC',sans-serif" font-size="16" font-weight="500" text-anchor="middle" fill="#fff">提出假设</text><text x="240" y="169" font-family="system-ui,-apple-system,'PingFang SC',sans-serif" font-size="15" font-weight="500" text-anchor="start" fill="#1d4040">季节性 / 并购 / 信用期 / 虚构交易</text><path d="M420 189 L420 200" stroke="#147f79" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="82" y="202" width="676" height="54" rx="10" fill="#edf5f1" stroke="#bc7443" stroke-width="1.5"/><rect x="83" y="202" width="140" height="54" rx="10" fill="#bc7443" stroke="#bc7443" stroke-width="1.5"/><text x="153" y="236" font-family="system-ui,-apple-system,'PingFang SC',sans-serif" font-size="16" font-weight="500" text-anchor="middle" fill="#fff">获取证据</text><text x="240" y="236" font-family="system-ui,-apple-system,'PingFang SC',sans-serif" font-size="15" font-weight="500" text-anchor="start" fill="#1d4040">合同、验收、物流、客户、银行流水</text><path d="M420 256 L420 267" stroke="#147f79" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="82" y="269" width="676" height="54" rx="10" fill="#f7f8f3" stroke="#a84e48" stroke-width="1.5"/><rect x="83" y="269" width="140" height="54" rx="10" fill="#a84e48" stroke="#a84e48" stroke-width="1.5"/><text x="153" y="303" font-family="system-ui,-apple-system,'PingFang SC',sans-serif" font-size="16" font-weight="500" text-anchor="middle" fill="#fff">交叉验证</text><text x="240" y="303" font-family="system-ui,-apple-system,'PingFang SC',sans-serif" font-size="15" font-weight="500" text-anchor="start" fill="#1d4040">交易对手能力、关联关系、期后退货</text><path d="M420 323 L420 334" stroke="#147f79" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="82" y="336" width="676" height="54" rx="10" fill="#edf5f1" stroke="#147f79" stroke-width="1.5"/><rect x="83" y="336" width="140" height="54" rx="10" fill="#147f79" stroke="#147f79" stroke-width="1.5"/><text x="153" y="370" font-family="system-ui,-apple-system,'PingFang SC',sans-serif" font-size="16" font-weight="500" text-anchor="middle" fill="#fff">结论边界</text><text x="240" y="370" font-family="system-ui,-apple-system,'PingFang SC',sans-serif" font-size="15" font-weight="500" text-anchor="start" fill="#1d4040">证实 / 排除 / 仍无法判断</text></svg>