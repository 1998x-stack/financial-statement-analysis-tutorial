<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 360" role="img" aria-labelledby="t22t d22t">
<title id="t22t">商誉减值的触发信号与会计后果</title>
<desc id="d22t">四类触发信号是业绩承诺不达标、所处行业下行、市值长期低于净资产、核心团队离职；它们指向减值测试，测试结果可能计提商誉减值，进而同时压低净利润与净资产。减值一旦计提不可转回。</desc>
<rect x="0" y="0" width="840" height="360" fill="#f8f7f2"/>
<text x="40" y="38" font-size="18" font-weight="700" fill="#1a1a1a">触发信号 → 减值测试 → 会计后果</text>
<g font-size="12.5">
<rect x="30" y="70" width="230" height="46" rx="7" fill="#f9eee5" stroke="#b66a38"/><text x="145" y="98" fill="#395253" text-anchor="middle">业绩承诺不达标</text>
<rect x="30" y="126" width="230" height="46" rx="7" fill="#f9eee5" stroke="#b66a38"/><text x="145" y="154" fill="#395253" text-anchor="middle">所处行业进入下行</text>
<rect x="30" y="182" width="230" height="46" rx="7" fill="#f9eee5" stroke="#b66a38"/><text x="145" y="210" fill="#395253" text-anchor="middle">市值长期低于净资产</text>
<rect x="30" y="238" width="230" height="46" rx="7" fill="#f9eee5" stroke="#b66a38"/><text x="145" y="266" fill="#395253" text-anchor="middle">核心团队离职</text>
</g>
<g stroke="#b66a38" stroke-width="1.6" fill="none">
<line x1="260" y1="93" x2="330" y2="160"/><line x1="260" y1="149" x2="330" y2="165"/><line x1="260" y1="205" x2="330" y2="175"/><line x1="260" y1="261" x2="330" y2="180"/>
</g>
<rect x="335" y="140" width="180" height="60" rx="8" fill="#eef2ed" stroke="#577173"/>
<text x="425" y="166" font-size="13" fill="#1c3133" text-anchor="middle">减值测试</text>
<text x="425" y="186" font-size="12.5" fill="#577173" text-anchor="middle">资产组可收回金额</text>
<line x1="515" y1="170" x2="580" y2="170" stroke="#577173" stroke-width="1.8"/>
<rect x="585" y="140" width="225" height="60" rx="8" fill="#fbeee9" stroke="#9e493b"/>
<text x="697" y="166" font-size="13" fill="#9e493b" text-anchor="middle">可能计提商誉减值</text>
<text x="697" y="186" font-size="12.5" fill="#395253" text-anchor="middle">净利润与净资产同时下降</text>
<rect x="335" y="238" width="475" height="86" rx="8" fill="#eef2ed" stroke="#577173"/>
<text x="355" y="264" font-size="12.5" fill="#1c3133">三项必须记住的性质：</text>
<text x="355" y="286" font-size="12.5" fill="#395253">① 商誉不摊销，但每年至少做一次减值测试；② 减值一经计提不可转回；</text>
<text x="355" y="306" font-size="12.5" fill="#395253">③ 减值是非现金的会计调整，但会直接减少利润与净资产。</text>
<text x="40" y="348" font-size="12.5" fill="#555">图注：触发信号只是“需要重新测试”的理由，不代表一定会减值；测试结果取决于可收回金额的估计，而估计本身带有判断空间。</text>
</svg>
