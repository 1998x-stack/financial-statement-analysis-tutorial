<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 380" role="img" aria-labelledby="s02-title s02-desc"><title id="s02-title">五步财报调查方法</title><desc id="s02-desc">先确定公司业务及报告范围，再用三张报表和附注交叉检验，最后建立可复核的推断</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#147f79" stroke-width="1.3"/></marker></defs><style>.label{font:700 19px system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}.detail{font:500 15px system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;fill:#526964}.small{font:600 13px system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;fill:#566e69}.number{font:760 26px system-ui,-apple-system,"PingFang SC",sans-serif}.caption{font:700 14px system-ui,-apple-system,"PingFang SC",sans-serif;fill:#173b3a}</style><rect width="840" height="380" fill="#fffefa" rx="16"/><text x="31" y="46" class="label" fill="#173b3a" text-anchor="start">把财报分析当成一次带证据的调查</text><rect x="29" y="101" width="150" height="142" rx="11" fill="#e9f4ef" stroke="#147f79" stroke-width="1.3"/><text x="47" y="139" class="number" fill="#147f79" text-anchor="start">01</text><text x="47" y="172" class="label" fill="#173b3a" text-anchor="start">确定业务</text><text x="47" y="205" class="small" fill="#173b3a" text-anchor="start">如何赚钱？</text><path d="M179 172 L193 172" stroke="#147f79" stroke-width="2.2" fill="none" marker-end="url(#arrow)"/><rect x="195" y="101" width="150" height="142" rx="11" fill="#f3f0f8" stroke="#7764aa" stroke-width="1.3"/><text x="213" y="139" class="number" fill="#7764aa" text-anchor="start">02</text><text x="213" y="172" class="label" fill="#173b3a" text-anchor="start">核对口径</text><text x="213" y="205" class="small" fill="#173b3a" text-anchor="start">范围一致？</text><path d="M345 172 L359 172" stroke="#147f79" stroke-width="2.2" fill="none" marker-end="url(#arrow)"/><rect x="361" y="101" width="150" height="142" rx="11" fill="#e9f4ef" stroke="#147f79" stroke-width="1.3"/><text x="379" y="139" class="number" fill="#147f79" text-anchor="start">03</text><text x="379" y="172" class="label" fill="#173b3a" text-anchor="start">拆解三表</text><text x="379" y="205" class="small" fill="#173b3a" text-anchor="start">钱与利润？</text><path d="M511 172 L525 172" stroke="#147f79" stroke-width="2.2" fill="none" marker-end="url(#arrow)"/><rect x="527" y="101" width="150" height="142" rx="11" fill="#f3f0f8" stroke="#7764aa" stroke-width="1.3"/><text x="545" y="139" class="number" fill="#7764aa" text-anchor="start">04</text><text x="545" y="172" class="label" fill="#173b3a" text-anchor="start">追溯附注</text><text x="545" y="205" class="small" fill="#173b3a" text-anchor="start">政策与交易？</text><path d="M677 172 L691 172" stroke="#147f79" stroke-width="2.2" fill="none" marker-end="url(#arrow)"/><rect x="693" y="101" width="150" height="142" rx="11" fill="#e9f4ef" stroke="#147f79" stroke-width="1.3"/><text x="711" y="139" class="number" fill="#147f79" text-anchor="start">05</text><text x="711" y="172" class="label" fill="#173b3a" text-anchor="start">写下反证</text><text x="711" y="205" class="small" fill="#173b3a" text-anchor="start">什么会推翻？</text><rect x="72" y="288" width="697" height="56" rx="9" fill="#fff8ea" stroke="#e1c58a"/><text x="420" y="322" class="caption" fill="#173b3a" text-anchor="middle">输出不是一句“好公司”，而是可核对的假设、证据与风险</text></svg>