<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 420" role="img" aria-labelledby="f06ch-title f06ch-desc"><title id="f06ch-title">政策、估计与差错的三个不同路径</title><desc id="f06ch-desc">会计政策变更关注追溯调整，估计变更一般未来适用，重大前期差错关注重述；规则存在例外，分类要以事实与准则判断</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6" fill="none" stroke="#147f79" stroke-width="1.5"/></marker></defs><rect width="840" height="420" rx="16" fill="#fffefa"/><text x="30" y="43" text-anchor="start" font-family="system-ui, sans-serif" font-size="22" font-weight="650" fill="#183c3a">财报数字改变了：先找变化的来源</text><rect x="298" y="72" width="244" height="57" rx="10" fill="#e8f3ee" stroke="#147f79" stroke-width="1.7"/><text x="420" y="106" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" font-weight="650" fill="#183c3a">发生了什么变化？</text><path d="M420 129 L420 153" fill="none" stroke="#147f79" stroke-width="2" marker-end="url(#arrow)"/><path d="M140 159 H700" stroke="#147f79" stroke-width="2"/><path d="M140 159 L140 187" fill="none" stroke="#147f79" stroke-width="2" marker-end="url(#arrow)"/><path d="M420 159 L420 187" fill="none" stroke="#147f79" stroke-width="2" marker-end="url(#arrow)"/><path d="M700 159 L700 187" fill="none" stroke="#147f79" stroke-width="2" marker-end="url(#arrow)"/><rect x="18" y="193" width="240" height="160" rx="10" fill="#fffdfa" stroke="#147f79" stroke-width="1.7"/><rect x="18" y="193" width="240" height="9" rx="3" fill="#147f79"/><text x="36" y="233" text-anchor="start" font-family="system-ui, sans-serif" font-size="21" font-weight="650" fill="#147f79">会计政策</text><text x="36" y="266" text-anchor="start" font-family="system-ui, sans-serif" font-size="15" font-weight="500" fill="#183c3a">原则 / 方法</text><text x="36" y="302" text-anchor="start" font-family="system-ui, sans-serif" font-size="16" font-weight="500" fill="#183c3a">通常追溯调整*</text><text x="36" y="328" text-anchor="start" font-family="system-ui, sans-serif" font-size="14" font-weight="500" fill="#4e6866">核对法定条件</text><rect x="300" y="193" width="240" height="160" rx="10" fill="#fffdfa" stroke="#7963aa" stroke-width="1.7"/><rect x="300" y="193" width="240" height="9" rx="3" fill="#7963aa"/><text x="318" y="233" text-anchor="start" font-family="system-ui, sans-serif" font-size="21" font-weight="650" fill="#7963aa">会计估计</text><text x="318" y="266" text-anchor="start" font-family="system-ui, sans-serif" font-size="15" font-weight="500" fill="#183c3a">寿命 / 信用损失</text><text x="318" y="302" text-anchor="start" font-family="system-ui, sans-serif" font-size="16" font-weight="500" fill="#183c3a">通常未来适用</text><text x="318" y="328" text-anchor="start" font-family="system-ui, sans-serif" font-size="14" font-weight="500" fill="#4e6866">核对新增信息</text><rect x="582" y="193" width="240" height="160" rx="10" fill="#fffdfa" stroke="#bb7545" stroke-width="1.7"/><rect x="582" y="193" width="240" height="9" rx="3" fill="#bb7545"/><text x="600" y="233" text-anchor="start" font-family="system-ui, sans-serif" font-size="21" font-weight="650" fill="#bb7545">前期差错</text><text x="600" y="266" text-anchor="start" font-family="system-ui, sans-serif" font-size="15" font-weight="500" fill="#183c3a">遗漏 / 错误应用</text><text x="600" y="302" text-anchor="start" font-family="system-ui, sans-serif" font-size="16" font-weight="500" fill="#183c3a">依规定更正重述</text><text x="600" y="328" text-anchor="start" font-family="system-ui, sans-serif" font-size="14" font-weight="500" fill="#4e6866">核对重要性</text><rect x="44" y="374" width="752" height="34" rx="10" fill="#f6f2e7" stroke="#e3d3ba" stroke-width="1.7"/><text x="420" y="396" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="500" fill="#183c3a">* 例外与过渡条款依具体准则判断；不能仅凭利润影响判定违规。</text></svg>