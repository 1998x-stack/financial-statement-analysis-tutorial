<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 420" role="img" aria-labelledby="f10days-title f10days-desc"><title id="f10days-title">平均余额与期间收入成本形成DSO DIO DPO天数</title><desc id="f10days-desc">收入1000、平均应收125、成本600、平均存货100、平均应付66.67，按360天得DSO45天、DIO60天、DPO约40天</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6" stroke="#147f79" fill="none" stroke-width="1.5"/></marker></defs><rect width="840" height="420" fill="#fffefa" rx="16"/><text x="27" y="42" font-family="system-ui,-apple-system,'PingFang SC',sans-serif" font-size="21" font-weight="650" text-anchor="start" fill="#1d4040">分子是平均余额，分母是期间流量</text><rect x="30" y="96" width="238" height="222" rx="10" fill="#fffdfa" stroke="#147f79" stroke-width="1.5"/><text x="45" y="139" font-family="system-ui,-apple-system,'PingFang SC',sans-serif" font-size="17" font-weight="650" text-anchor="start" fill="#147f79">应收平均 125</text><text x="45" y="176" font-family="system-ui,-apple-system,'PingFang SC',sans-serif" font-size="21" font-weight="650" text-anchor="start" fill="#1d4040">÷</text><text x="45" y="215" font-family="system-ui,-apple-system,'PingFang SC',sans-serif" font-size="16" font-weight="500" text-anchor="start" fill="#1d4040">收入 1,000</text><path d="M46 186 H250" stroke="#147f79" stroke-width="2"/><text x="45" y="282" font-family="system-ui,-apple-system,'PingFang SC',sans-serif" font-size="19" font-weight="650" text-anchor="start" fill="#147f79">DSO = 45 天</text><rect x="301" y="96" width="238" height="222" rx="10" fill="#fffdfa" stroke="#7663a8" stroke-width="1.5"/><text x="316" y="139" font-family="system-ui,-apple-system,'PingFang SC',sans-serif" font-size="17" font-weight="650" text-anchor="start" fill="#7663a8">存货平均 100</text><text x="316" y="176" font-family="system-ui,-apple-system,'PingFang SC',sans-serif" font-size="21" font-weight="650" text-anchor="start" fill="#1d4040">÷</text><text x="316" y="215" font-family="system-ui,-apple-system,'PingFang SC',sans-serif" font-size="16" font-weight="500" text-anchor="start" fill="#1d4040">营业成本 600</text><path d="M317 186 H521" stroke="#7663a8" stroke-width="2"/><text x="316" y="282" font-family="system-ui,-apple-system,'PingFang SC',sans-serif" font-size="19" font-weight="650" text-anchor="start" fill="#7663a8">DIO = 60 天</text><rect x="573" y="96" width="238" height="222" rx="10" fill="#fffdfa" stroke="#bc7443" stroke-width="1.5"/><text x="588" y="139" font-family="system-ui,-apple-system,'PingFang SC',sans-serif" font-size="17" font-weight="650" text-anchor="start" fill="#bc7443">应付平均 66.67</text><text x="588" y="176" font-family="system-ui,-apple-system,'PingFang SC',sans-serif" font-size="21" font-weight="650" text-anchor="start" fill="#1d4040">÷</text><text x="588" y="215" font-family="system-ui,-apple-system,'PingFang SC',sans-serif" font-size="16" font-weight="500" text-anchor="start" fill="#1d4040">成本 600（近似）</text><path d="M589 186 H793" stroke="#bc7443" stroke-width="2"/><text x="588" y="282" font-family="system-ui,-apple-system,'PingFang SC',sans-serif" font-size="19" font-weight="650" text-anchor="start" fill="#bc7443">DPO ≈ 40 天</text><rect x="43" y="346" width="755" height="48" rx="10" fill="#ecf4ee" stroke="#bcd4c9" stroke-width="1.5"/><text x="420" y="376" font-family="system-ui,-apple-system,'PingFang SC',sans-serif" font-size="15" font-weight="500" text-anchor="middle" fill="#1d4040">统一 360 天示例；真实期间请统一 365/366 天与报表周期</text></svg>