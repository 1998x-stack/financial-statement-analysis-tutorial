<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 430" role="img" aria-labelledby="s07-title s07-desc"><title id="s07-title">现金流量表经营、投资、筹资三类活动之和</title><desc id="s07-desc">示例经营净现金流加80，投资净现金流负90，筹资净现金流加50，忽略汇率影响，现金及现金等价物净增加40</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#147f79" stroke-width="1.3"/></marker></defs><style>.label{font:700 19px system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}.detail{font:500 15px system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}.small{font:600 13px system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}.number{font:760 26px system-ui,-apple-system,"PingFang SC",sans-serif}.caption{font:700 14px system-ui,-apple-system,"PingFang SC",sans-serif;fill:#173b3a}</style><rect width="840" height="430" fill="#fffefa" rx="16"/><text x="32" y="45" class="label" fill="#173b3a" text-anchor="start">现金流入和流出的三类活动</text><rect x="27" y="101" width="254" height="85" rx="12" fill="#fffdfa" stroke="#147f79" stroke-width="2"/><rect x="27" y="101" width="8" height="85" rx="4" fill="#147f79"/><text x="46" y="131" class="label" fill="#173b3a">经营活动</text><text x="46" y="158" class="detail" fill="#526964">＋80 万 · 业务造血</text><rect x="293" y="101" width="254" height="85" rx="12" fill="#fffdfa" stroke="#c17b48" stroke-width="2"/><rect x="293" y="101" width="8" height="85" rx="4" fill="#c17b48"/><text x="312" y="131" class="label" fill="#173b3a">投资活动</text><text x="312" y="158" class="detail" fill="#526964">−90 万 · 购买资产</text><rect x="559" y="101" width="254" height="85" rx="12" fill="#fffdfa" stroke="#7764aa" stroke-width="2"/><rect x="559" y="101" width="8" height="85" rx="4" fill="#7764aa"/><text x="578" y="131" class="label" fill="#173b3a">筹资活动</text><text x="578" y="158" class="detail" fill="#526964">＋50 万 · 外部融资</text><path d="M154 187 L154 257" stroke="#147f79" stroke-width="2.2" fill="none" marker-end="url(#ar