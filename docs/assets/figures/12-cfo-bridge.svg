<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 430" role="img" aria-labelledby="f12cfo-title f12cfo-desc"><title id="f12cfo-title">净利润调节至经营现金流的间接桥接</title><desc id="f12cfo-desc">净利润120，加折旧30、减值10，扣除处置收益5，减应收增加40和存货增加20，加经营应付增加15，得到经营现金流110</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6" stroke="#147f79" fill="none" stroke-width="1.5"/></marker></defs><rect width="840" height="430" fill="#fffefa" rx="16"/><text x="28" y="42" font-family="system-ui,-apple-system,'PingFang SC',sans-serif" font-size="21" font-weight="650" text-anchor="start" fill="#1d4040">利润怎样经过营运资本，变成经营现金？</text><rect x="30" y="72" width="252" height="38" rx="6" fill="#edf5f1" stroke="#147f79" stroke-width="1.5"/><text x="45" y="97" font-family="system-ui,-apple-system,'PingFang SC',sans-serif" font-size="14" font-weight="500" text-anchor="start" fill="#147f79">净利润</text><text x="267" y="97" font-family="system-ui,-apple-system,'PingFang SC',sans-serif" font-size="15" font-weight="500" text-anchor="end" fill="#147f79">+120</text><rect x="30" y="120" width="252" height="38" rx="6" fill="#fffdfa" stroke="#7663a8" stroke-width="1.5"/><text x="45" y="145" font-family="system-ui,-apple-system,'PingFang SC',sans-serif" font-size="14" font-weight="500" text-anchor="start" fill="#7663a8">折旧与减值</text><text x="267" y="145" font-family="system-ui,-apple-system,'PingFang SC',sans-serif" font-size="15" font-weight="500" text-anchor="end" fill="#7663a8">+40</text><rect x="30" y="168" width="252" height="38" rx="6" fill="#fffdfa" stroke="#bc7443" stroke-width="1.5"/><text x="45" y="193" font-family="system-ui,-apple-system,'PingFang SC',sans-serif" font-size="14" font-weight="500" text-anchor="start" fill="#bc7443">处置收益</text><text x="267" y="193" font-family="system-ui,-apple-system,'PingFang SC',sans-serif" font-size="15" font-weight="500" text-anchor="end" fill="#bc7443">-5</text><rect x="30" y="216" width="252" height="38" rx="6" fill="#fffdfa" stroke="#a84e48" stroke-width="1.5"/><text x="45" y="241" font-family="system-ui,-apple-system,'PingFang SC',sans-serif" font-size="14" font-weight="500" text-anchor="start" fill="#a84e48">应收增加</text><text x="267" y="241" font-family="system-ui,-apple-system,'PingFang SC',sans-serif" font-size="15" font-weight="500" text-anchor="end" fill="#a84e48">-40</text><rect x="30" y="264" width="252" height="38" rx="6" fill="#fffdfa" stroke="#a84e48" stroke-width="1.5"/><text x="45" y="289" font-family="system-ui,-apple-system,'PingFang SC',sans-serif" font-size="14" font-weight="500" text-anchor="start" fill="#a84e48">存货增加</text><text x="267" y="289" font-family="system-ui,-apple-system,'PingFang SC',sans-serif" font-size="15" font-weight="500" text-anchor="end" fill="#a84e48">-20</text><rect x="30" y="312" width="252" height="38" rx="6" fill="#fffdfa" stroke="#7663a8" stroke-width="1.5"/><text x="45" y="337" font-family="system-ui,-apple-system,'PingFang SC',sans-serif" font-size="14" font-weight="500" text-anchor="start" fill="#7663a8">经营应付增加</text><text x="267" y="337" font-family="system-ui,-apple-system,'PingFang SC',sans-serif" font-size="15" font-weight="500" text-anchor="end" fill="#7663a8">+15</text><path d="M290 218 L352 218" stroke="#147f79" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="362" y="158" width="440" height="120" rx="10" fill="#eaf4ee" stroke="#147f79" stroke-width="1.5"/><text x="386" y="193" font-family="system-ui,-apple-system,'PingFang SC',sans-serif" font-size="16" font-weight="500" text-anchor="start" fill="#59736d">经营活动现金流净额 CFO</text><text x="386" y="239" font-family="system-ui,-apple-system,'PingFang SC',sans-serif" font-size="31" font-weight="650" text-anchor="start" fill="#147f79">110 万元</text><text x="386" y="263" font-family="system-ui,-apple-system,'PingFang SC',sans-serif" font-size="14" font-weight="500" text-anchor="start" fill="#1d4040">= 120 + 30 + 10 − 5 − 40 − 20 + 15</text><rect x="64" y="377" width="712" height="38" rx="10" fill="#f6f3e9" stroke="#d9cba9" stroke-width="1.5"/><text x="420" y="402" font-family="system-ui,-apple-system,'PingFang SC',sans-serif" font-size="14" font-weight="500" text-anchor="middle" fill="#1d4040">营运资产增加通常占用现金；经营性应付增加通常暂时释放现金</text></svg>