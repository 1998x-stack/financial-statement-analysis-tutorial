<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 420" role="img" aria-labelledby="f13five-title f13five-desc"><title id="f13five-title">五因素杜邦分解将ROE拆为税负、利息负担、经营利润率、资产效率与杠杆</title><desc id="f13five-desc">示例净利润90、税前利润120、EBIT150、收入1000、平均资产750、平均权益300，五因素相乘得到30% ROE</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6" stroke="#147f79" fill="none" stroke-width="1.5"/></marker></defs><rect width="840" height="420" fill="#fffefa" rx="16"/><text x="28" y="42" font-family="system-ui,-apple-system,'PingFang SC',sans-serif" font-size="21" font-weight="650" text-anchor="start" fill="#1d4040">同一个 ROE，拆开看才能找到驱动因素</text><rect x="18" y="103" width="140" height="174" rx="10" fill="#fffdfa" stroke="#147f79" stroke-width="1.5"/><text x="88" y="139" font-family="system-ui,-apple-system,'PingFang SC',sans-serif" font-size="14" font-weight="500" text-anchor="middle" fill="#147f79">税负因子</text><text x="88" y="188" font-family="system-ui,-apple-system,'PingFang SC',sans-serif" font-size="13" font-weight="500" text-anchor="middle" fill="#59736d">NI / PBT</text><text x="88" y="239" font-family="system-ui,-apple-system,'PingFang SC',sans-serif" font-size="23" font-weight="650" text-anchor="middle" fill="#147f79">0.75</text><rect x="184" y="103" width="140" height="174" rx="10" fill="#fffdfa" stroke="#7663a8" stroke-width="1.5"/><text x="254" y="139" font-family="system-ui,-apple-system,'PingFang SC',sans-serif" font-size="14" font-weight="500" text-anchor="middle" fill="#7663a8">利息负担</text><text x="254" y="188" font-family="system-ui,-apple-system,'PingFang SC',sans-serif" font-size="13" font-weight="500" text-anchor="middle" fill="#59736d">PBT / EBIT</text><text x="254" y="239" font-family="system-ui,-apple-system,'PingFang SC',sans-serif" font-size="23" font-weight="650" text-anchor="middle" fill="#7663a8">0.80</text><rect x="350" y="103" width="140" height="174" rx="10" fill="#fffdfa" stroke="#bc7443" stroke-width="1.5"/><text x="420" y="139" font-family="system-ui,-apple-system,'PingFang SC',sans-serif" font-size="14" font-weight="500" text-anchor="middle" fill="#bc7443">EBIT 利润率</text><text x="420" y="188" font-family="system-ui,-apple-system,'PingFang SC',sans-serif" font-size="13" font-weight="500" text-anchor="middle" fill="#59736d">EBIT / 收入</text><text x="420" y="239" font-family="system-ui,-apple-system,'PingFang SC',sans-serif" font-size="23" font-weight="650" text-anchor="middle" fill="#bc7443">15%</text><rect x="516" y="103" width="140" height="174" rx="10" fill="#fffdfa" stroke="#147f79" stroke-width="1.5"/><text x="586" y="139" font-family="system-ui,-apple-system,'PingFang SC',sans-serif" font-size="14" font-weight="500" text-anchor="middle" fill="#147f79">资产周转</text><text x="586" y="188" font-family="system-ui,-apple-system,'PingFang SC',sans-serif" font-size="13" font-weight="500" text-anchor="middle" fill="#59736d">收入 / 平均资产</text><text x="586" y="239" font-family="system-ui,-apple-system,'PingFang SC',sans-serif" font-size="23" font-weight="650" text-anchor="middle" fill="#147f79">1.33×</text><rect x="682" y="103" width="140" height="174" rx="10" fill="#fffdfa" stroke="#7663a8" stroke-width="1.5"/><text x="752" y="139" font-family="system-ui,-apple-system,'PingFang SC',sans-serif" font-size="14" font-weight="500" text-anchor="middle" fill="#7663a8">权益乘数</text><text x="752" y="188" font-family="system-ui,-apple-system,'PingFang SC',sans-serif" font-size="13" font-weight="500" text-anchor="middle" fill="#59736d">平均资产 / 平均权益</text><text x="752" y="239" font-family="system-ui,-apple-system,'PingFang SC',sans-serif" font-size="23" font-weight="650" text-anchor="middle" fill="#7663a8">2.50×</text><text x="420" y="319" font-family="system-ui,-apple-system,'PingFang SC',sans-serif" font-size="18" font-weight="650" text-anchor="middle" fill="#1d4040">0.75 × 0.80 × 15% × 1.33 × 2.50</text><rect x="235" y="346" width="370" height="56" rx="10" fill="#eaf4ee" stroke="#147f79" stroke-width="1.5"/><text x="420" y="383" font-family="system-ui,-apple-system,'PingFang SC',sans-serif" font-size="25" font-weight="650" text-anchor="middle" fill="#147f79">ROE = 30%</text></svg>