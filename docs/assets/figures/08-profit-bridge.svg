<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 430" role="img" aria-labelledby="f08bridge-title f08bridge-desc"><title id="f08bridge-title">教学案例从营业收入到毛利再到净利润</title><desc id="f08bridge-desc">营业收入1000，营业成本650，毛利350，净利润120，费用税费和其他所有收入成本损益净影响为230，不能把示意扣减230直接称作完整法定营业利润</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6" stroke="#147f79" fill="none" stroke-width="1.5"/></marker></defs><rect width="840" height="430" fill="#fffefa" rx="16"/><text x="28" y="43" font-family="system-ui,-apple-system,'PingFang SC',sans-serif" font-size="20" font-weight="650" text-anchor="start" fill="#1d4040">把 1,000 的营收拆成：成本、其他净损益、净利润</text><text x="28" y="77" font-family="system-ui,-apple-system,'PingFang SC',sans-serif" font-size="14" font-weight="500" text-anchor="start" fill="#59736d">示意金额（万元）｜毛利=1000−650=350；净利润=120</text><rect x="32" y="36" width="600" height="52" rx="4" fill="#147f79" stroke="#147f79" stroke-width="1.5"/><text x="48" y="70" font-family="system-ui,-apple-system,'PingFang SC',sans-serif" font-size="16" font-weight="500" text-anchor="start" fill="#fff">营业收入 1,000</text><path d="M748 88 L748 111" stroke="#147f79" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="32" y="112" width="390" height="52" rx="4" fill="#bc7443" stroke="#bc7443" stroke-width="1.5"/><text x="48" y="146" font-family="system-ui,-apple-system,'PingFang SC',sans-serif" font-size="16" font-weight="500" text-anchor="start" fill="#fff">营业成本 650</text><path d="M748 164 L748 187" stroke="#147f79" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="32" y="188" width="210" height="52" rx="4" fill="#7663a8" stroke="#7663a8" stroke-width="1.5"/><text x="48" y="222" font-family="system-ui,-apple-system,'PingFang SC',sans-serif" font-size="16" font-weight="500" text-anchor="start" fill="#fff">毛利 350</text><path d="M748 240 L748 263" stroke="#147f79" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="32" y="264" width="140" height="52" rx="4" fill="#bc7443" stroke="#bc7443" stroke-width="1.5"/><text x="48" y="298" font-family="system-ui,-apple-system,'PingFang SC',sans-serif" font-size="16" font-weight="500" text-anchor="start" fill="#fff">其他项目合计 −230</text><path d="M748 316 L748 339" stroke="#147f79" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="32" y="340" width="140" height="52" rx="4" fill="#147f79" stroke="#147f79" stroke-width="1.5"/><text x="48" y="374" font-family="system-ui,-apple-system,'PingFang SC',sans-serif" font-size="16" font-weight="500" text-anchor="start" fill="#fff">净利润 120</text><text x="806" y="132" font-family="system-ui,-apple-system,'PingFang SC',sans-serif" font-size="17" font-weight="650" text-anchor="end" fill="#147f79">100%</text><text x="806" y="207" font-family="system-ui,-apple-system,'PingFang SC',sans-serif" font-size="17" font-weight="650" text-anchor="end" fill="#bc7443">65%</text><text x="806" y="284" font-family="system-ui,-apple-system,'PingFang SC',sans-serif" font-size="17" font-weight="650" text-anchor="end" fill="#7663a8">35%</text><text x="806" y="359" font-family="system-ui,-apple-system,'PingFang SC',sans-serif" font-size="17" font-weight="650" text-anchor="end" fill="#147f79">12%</text></svg>