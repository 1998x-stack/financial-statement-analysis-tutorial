<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 420" role="img" aria-labelledby="f14dist-title f14dist-desc"><title id="f14dist-title">目标公司ROE12%低于四家可比公司中位数16.5%</title><desc id="f14dist-desc">可比样本ROE为8、15、18、35，均值19，中位数16.5；目标12低于样本中位数，但高于一个样本，不能据此推断价值高低</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6" stroke="#147f79" fill="none" stroke-width="1.5"/></marker></defs><rect width="840" height="420" fill="#fffefa" rx="16"/><text x="28" y="43" font-family="system-ui,-apple-system,'PingFang SC',sans-serif" font-size="21" font-weight="650" text-anchor="start" fill="#1d4040">一个极端值，会让平均数偏离典型公司</text><text x="34" y="80" font-family="system-ui,-apple-system,'PingFang SC',sans-serif" font-size="14" font-weight="500" text-anchor="start" fill="#59736d">同一期间、同一口径的 ROE（教学虚构，%）</text><rect x="197" y="211" width="52" height="50" rx="25" fill="#f4f0fa" stroke="#7663a8" stroke-width="1.5"/><text x="223" y="243" font-family="system-ui,-apple-system,'PingFang SC',sans-serif" font-size="18" font-weight="650" text-anchor="middle" fill="#7663a8">8</text><text x="223" y="288" font-family="system-ui,-apple-system,'PingFang SC',sans-serif" font-size="12" font-weight="500" text-anchor="middle" fill="#59736d">样本</text><rect x="261" y="147" width="52" height="50" rx="25" fill="#e8f4ef" stroke="#147f79" stroke-width="1.5"/><text x="287" y="179" font-family="system-ui,-apple-system,'PingFang SC',sans-serif" font-size="18" font-weight="650" text-anchor="middle" fill="#147f79">12</text><text x="287" y="224" font-family="system-ui,-apple-system,'PingFang SC',sans-serif" font-size="12" font-weight="500" text-anchor="middle" fill="#59736d">目标</text><rect x="309" y="211" width="52" height="50" rx="25" fill="#f4f0fa" stroke="#7663a8" stroke-width="1.5"/><text x="335" y="243" font-family="system-ui,-apple-system,'PingFang SC',sans-serif" font-size="18" font-weight="650" text-anchor="middle" fill="#7663a8">15</text><text x="335" y="288" font-family="system-ui,-apple-system,'PingFang SC',sans-serif" font-size="12" font-weight="500" text-anchor="middle" fill="#59736d">样本</text><rect x="357" y="211" width="52" height="50" rx="25" fill="#f4f0fa" stroke="#7663a8" stroke-width="1.5"/><text x="383" y="243" font-family="system-ui,-apple-system,'PingFang SC',sans-serif" font-size="18" font-weight="650" text-anchor="middle" fill="#7663a8">18</text><text x="383" y="288" font-family="system-ui,-apple-system,'PingFang SC',sans-serif" font-size="12" font-weight="500" text-anchor="middle" fill="#59736d">样本</text><rect x="629" y="211" width="52" height="50" rx="25" fill="#f4f0fa" stroke="#bc7443" stroke-width="1.5"/><text x="655" y="243" font-family="system-ui,-apple-system,'PingFang SC',sans-serif" font-size="18" font-weight="650" text-anchor="middle" fill="#bc7443">35</text><text x="655" y="288" font-family="system-ui,-apple-system,'PingFang SC',sans-serif" font-size="12" font-weight="500" text-anchor="middle" fill="#59736d">高值</text><path d="M335 118 L335 204" stroke="#147f79" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="414" y="102" width="365" height="94" rx="10" fill="#edf5f1" stroke="#147f79" stroke-width="1.5"/><text x="434" y="137" font-family="system-ui,-apple-system,'PingFang SC',sans-serif" font-size="15" font-weight="500" text-anchor="start" fill="#59736d">可比组中位数</text><text x="434" y="175" font-family="system-ui,-apple-system,'PingFang SC',sans-serif" font-size="25" font-weight="650" text-anchor="start" fill="#147f79">16.5%</text><rect x="414" y="220" width="365" height="94" rx="10" fill="#fbf0e8" stroke="#bc7443" stroke-width="1.5"/><text x="434" y="255" font-family="system-ui,-apple-system,'PingFang SC',sans-serif" font-size="15" font-weight="500" text-anchor="start" fill="#59736d">可比组均值</text><text x="434" y="293" font-family="system-ui,-apple-system,'PingFang SC',sans-serif" font-size="25" font-weight="650" text-anchor="start" fill="#bc7443">19.0%</text><text x="420" y="374" font-family="system-ui,-apple-system,'PingFang SC',sans-serif" font-size="15" font-weight="500" text-anchor="middle" fill="#1d4040">目标公司 12% 位于样本中较低位置；仍需解释商业模式差异</text></svg>