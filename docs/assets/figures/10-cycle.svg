<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 420" role="img" aria-labelledby="f10ccc-title f10ccc-desc"><title id="f10ccc-title">现金转换周期由存货天数、应收天数和应付天数组合</title><desc id="f10ccc-desc">教学案例存货天数60，加应收45，减应付40，现金转换周期为65天，以一年360天计算</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6" stroke="#147f79" fill="none" stroke-width="1.5"/></marker></defs><rect width="840" height="420" fill="#fffefa" rx="16"/><text x="28" y="41" font-family="system-ui,-apple-system,'PingFang SC',sans-serif" font-size="21" font-weight="650" text-anchor="start" fill="#1d4040">从采购、销售到回款：资金被占用多少天？</text><rect x="40" y="93" width="310" height="67" rx="10" fill="#e9f4ef" stroke="#147f79" stroke-width="1.5"/><text x="58" y="121" font-family="system-ui,-apple-system,'PingFang SC',sans-serif" font-size="18" font-weight="650" text-anchor="start" fill="#147f79">DIO · 存货 60 天</text><text x="58" y="146" font-family="system-ui,-apple-system,'PingFang SC',sans-serif" font-size="14" font-weight="500" text-anchor="start" fill="#59736d">原料/产品占用资金</text><path d="M351 128 L385 128" stroke="#147f79" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="391" y="93" width="310" height="67" rx="10" fill="#f1edfa" stroke="#7663a8" stroke-width="1.5"/><text x="412" y="121" font-family="system-ui,-apple-system,'PingFang SC',sans-serif" font-size="18" font-weight="650" text-anchor="start" fill="#7663a8">DSO · 应收 45 天</text><text x="412" y="146" font-family="system-ui,-apple-system,'PingFang SC',sans-serif" font-size="14" font-weight="500" text-anchor="start" fill="#59736d">产品交付到收款</text><rect x="40" y="210" width="309" height="65" rx="10" fill="#fcf1e9" stroke="#bc7443" stroke-width="1.5"/><text x="57" y="239" font-family="system-ui,-apple-system,'PingFang SC',sans-serif" font-size="18" font-weight="650" text-anchor="start" fill="#bc7443">DPO · 应付 40 天</text><text x="57" y="260" font-family="system-ui,-apple-system,'PingFang SC',sans-serif" font-size="14" font-weight="500" text-anchor="start" fill="#59736d">供应商融资期限（减项）</text><path d="M352 242 L390 242" stroke="#147f79" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="395" y="210" width="305" height="65" rx="10" fill="#eaf4ef" stroke="#147f79" stroke-width="1.5"/><text x="415" y="239" font-family="system-ui,-apple-system,'PingFang SC',sans-serif" font-size="17" font-weight="650" text-anchor="start" fill="#147f79">CCC = 60 + 45 − 40</text><text x="415" y="263" font-family="system-ui,-apple-system,'PingFang SC',sans-serif" font-size="21" font-weight="650" text-anchor="start" fill="#147f79">= 65 天</text><rect x="68" y="326" width="704" height="61" rx="10" fill="#f5f7ef" stroke="#cedccf" stroke-width="1.5"/><text x="420" y="352" font-family="system-ui,-apple-system,'PingFang SC',sans-serif" font-size="16" font-weight="500" text-anchor="middle" fill="#1d4040">正数表示投入至收回现金之间存在示意资金缺口</text><text x="420" y="375" font-family="system-ui,-apple-system,'PingFang SC',sans-serif" font-size="14" font-weight="500" text-anchor="middle" fill="#59736d">负数也不必然好：需核对预收、付款与供应商关系</text></svg>