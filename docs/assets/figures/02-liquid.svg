<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 390" role="img" aria-labelledby="s04-title s04-desc"><title id="s04-title">流动资产与可动用现金的区别</title><desc id="s04-desc">现金180万中受限80万，可动用100万；加上应收200万和存货120万，流动资产500万，但不等于可立即偿债的现金500万</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#147f79" stroke-width="1.3"/></marker></defs><style>.label{font:700 19px system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}.detail{font:500 15px system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}.small{font:600 13px system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}.number{font:760 26px system-ui,-apple-system,"PingFang SC",sans-serif}.caption{font:700 14px system-ui,-apple-system,"PingFang SC",sans-serif;fill:#173b3a}</style><rect width="840" height="390" fill="#fffefa" rx="16"/><text x="35" y="45" class="label" fill="#173b3a" text-anchor="start">“账上有钱”≠“马上能还钱”</text><rect x="28" y="96" width="244" height="84" rx="12" fill="#fffdfa" stroke="#147f79" stroke-width="2"/><rect x="28" y="96" width="8" height="84" rx="4" fill="#147f79"/><text x="47" y="126" class="label" fill="#173b3a">现金及存款 180</text><text x="47" y="153" class="detail" fill="#526964">包含受限款项 80</text><rect x="299" y="96" width="244" height="84" rx="12" fill="#fffdfa" stroke="#7764aa" stroke-width="2"/><rect x="299" y="96" width="8" height="84" rx="4" fill="#7764aa"/><text x="318" y="126" class="label" fill="#173b3a">应收账款 200</text><text x="318" y="153" class="detail" fill="#526964">回款时间及坏账风险</text><rect x="570" y="96" width="244" height="84" rx="12" fill="#fffdfa" stroke="#c17b48" stroke-width="2"/><rect x="570" y="96" width="8" height="84" rx="4" fill="#c17b48"/><text x="589" y="126" class="label" fill="#173b3a">存货 120</text><text x="589" y="153" class="detail" fill="#526964">变现价值与周期</text><path d="M150 182 L150 222" stroke="#147f79" stroke-width="2.2" fill="none" marker-end="url(#arrow)"/><path d="M422 182 L422 222" stroke="#147f79" stroke-width="2.2" fill="none" marker-end="url(#arrow)"/><path d="M692 182 L692 222" stroke="#147f79" stroke-width="2.2" fill="none" marker-end="url(#arrow)"/><rect x="30" y="233" width="238" height="70" rx="8" fill="#e9f4ef" stroke="#147f79"/><text x="149" y="263" class="caption" fill="#173b3a" text-anchor="middle">可动用现金</text><text x="149" y="290" class="number" fill="#147f79" text-anchor="middle">100</text><text x="421" y="269" class="label" fill="#ad5248" text-anchor="middle">≠ 即时现金</text><rect x="572" y="233" width="238" height="70" rx="8" fill="#fff2e8" stroke="#c17b48"/><text x="691" y="262" class="caption" fill="#173b3a" text-anchor="middle">短期到期负债</text><text x="691" y="290" class="number" fill="#c17b48" text-anchor="middle">300</text><text x="420" y="349" class="small" fill="#5c7773" text-anchor="middle">资产负债率、流动比率与可动用现金回答的是不同问题</text></svg>