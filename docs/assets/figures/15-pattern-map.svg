<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 445" role="img" aria-labelledby="f15patterns-title f15patterns-desc"><title id="f15patterns-title">财务报告风险类别与对应的独立核查证据</title><desc id="f15patterns-desc">收入、费用资本化、资产估值、关联方和现金流分类均有不同证据路径，单一财务比率不能证明舞弊</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6" stroke="#147f79" fill="none" stroke-width="1.5"/></marker></defs><rect width="840" height="445" fill="#fffefa" rx="16"/><text x="28" y="42" font-family="system-ui,-apple-system,'PingFang SC',sans-serif" font-size="21" font-weight="650" text-anchor="start" fill="#1d4040">常见风险类别与核查证据必须一一对应</text><rect x="34" y="76" width="770" height="52" rx="10" fill="#fffdfa" stroke="#147f79" stroke-width="1.5"/><rect x="35" y="76" width="190" height="52" rx="10" fill="#147f79" stroke="#147f79" stroke-width="1.5"/><text x="130" y="108" font-family="system-ui,-apple-system,'PingFang SC',sans-serif" font-size="16" font-weight="500" text-anchor="middle" fill="#fff">收入与合同</text><text x="288" y="108" font-family="system-ui,-apple-system,'PingFang SC',sans-serif" font-size="15" font-weight="500" text-anchor="start" fill="#1d4040">控制权、验收、退货、客户确认</text><rect x="34" y="142" width="770" height="52" rx="10" fill="#fffdfa" stroke="#7663a8" stroke-width="1.5"/><rect x="35" y="142" width="190" height="52" rx="10" fill="#7663a8" stroke="#7663a8" stroke-width="1.5"/><text x="130" y="174" font-family="system-ui,-apple-system,'PingFang SC',sans-serif" font-size="16" font-weight="500" text-anchor="middle" fill="#fff">费用与资本化</text><text x="288" y="174" font-family="system-ui,-apple-system,'PingFang SC',sans-serif" font-size="15" font-weight="500" text-anchor="start" fill="#1d4040">研发阶段、项目工时、技术可行性</text><rect x="34" y="208" width="770" height="52" rx="10" fill="#fffdfa" stroke="#bc7443" stroke-width="1.5"/><rect x="35" y="208" width="190" height="52" rx="10" fill="#bc7443" stroke="#bc7443" stroke-width="1.5"/><text x="130" y="240" font-family="system-ui,-apple-system,'PingFang SC',sans-serif" font-size="16" font-weight="500" text-anchor="middle" fill="#fff">资产与估计</text><text x="288" y="240" font-family="system-ui,-apple-system,'PingFang SC',sans-serif" font-size="15" font-weight="500" text-anchor="start" fill="#1d4040">账龄、盘点、期后销售、减值假设</text><rect x="34" y="274" width="770" height="52" rx="10" fill="#fffdfa" stroke="#a84e48" stroke-width="1.5"/><rect x="35" y="274" width="190" height="52" rx="10" fill="#a84e48" stroke="#a84e48" stroke-width="1.5"/><text x="130" y="306" font-family="system-ui,-apple-system,'PingFang SC',sans-serif" font-size="16" font-weight="500" text-anchor="middle" fill="#fff">关联方与担保</text><text x="288" y="306" font-family="system-ui,-apple-system,'PingFang SC',sans-serif" font-size="15" font-weight="500" text-anchor="start" fill="#1d4040">交易对手、资金流向、董事会审批</text><rect x="34" y="340" width="770" height="52" rx="10" fill="#fffdfa" stroke="#147f79" stroke-width="1.5"/><rect x="35" y="340" width="190" height="52" rx="10" fill="#147f79" stroke="#147f79" stroke-width="1.5"/><text x="130" y="372" font-family="system-ui,-apple-system,'PingFang SC',sans-serif" font-size="16" font-weight="500" text-anchor="middle" fill="#fff">现金流分类</text><text x="288" y="372" font-family="system-ui,-apple-system,'PingFang SC',sans-serif" font-size="15" font-weight="500" text-anchor="start" fill="#1d4040">银行函证、保理条款、融资协议</text><text x="420" y="421" font-family="system-ui,-apple-system,'PingFang SC',sans-serif" font-size="14" font-weight="500" text-anchor="middle" fill="#59736d">风险线索是调查起点，不是对公司或个人的舞弊认定</text></svg>