<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 420" role="img" aria-labelledby="f13drivers-title f13drivers-desc"><title id="f13drivers-title">相同30% ROE可以由高净利率或高权益乘数形成</title><desc id="f13drivers-desc">公司A净利率12%、资产周转1.25倍、权益乘数2倍；公司B净利率6%、周转1.25倍、权益乘数4倍，两者ROE均30%</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6" stroke="#147f79" fill="none" stroke-width="1.5"/></marker></defs><rect width="840" height="420" fill="#fffefa" rx="16"/><text x="28" y="43" font-family="system-ui,-apple-system,'PingFang SC',sans-serif" font-size="21" font-weight="650" text-anchor="start" fill="#1d4040">相同结果，不代表相同风险结构</text><rect x="34" y="96" width="360" height="228" rx="10" fill="#edf5f1" stroke="#147f79" stroke-width="1.5"/><text x="58" y="137" font-family="system-ui,-apple-system,'PingFang SC',sans-serif" font-size="20" font-weight="650" text-anchor="start" fill="#147f79">公司 A · 盈利驱动</text><text x="58" y="184" font-family="system-ui,-apple-system,'PingFang SC',sans-serif" font-size="16" font-weight="500" text-anchor="start" fill="#1d4040">12% 净利率 × 1.25 周转</text><text x="58" y="220" font-family="system-ui,-apple-system,'PingFang SC',sans-serif" font-size="16" font-weight="500" text-anchor="start" fill="#1d4040">× 2.0 权益乘数</text><text x="58" y="285" font-family="system-ui,-apple-system,'PingFang SC',sans-serif" font-size="27" font-weight="650" text-anchor="start" fill="#147f79">= 30% ROE</text><rect x="446" y="96" width="360" height="228" rx="10" fill="#fbf0e8" stroke="#bc7443" stroke-width="1.5"/><text x="470" y="137" font-family="system-ui,-apple-system,'PingFang SC',sans-serif" font-size="20" font-weight="650" text-anchor="start" fill="#bc7443">公司 B · 杠杆驱动</text><text x="470" y="184" font-family="system-ui,-apple-system,'PingFang SC',sans-serif" font-size="16" font-weight="500" text-anchor="start" fill="#1d4040">6% 净利率 × 1.25 周转</text><text x="470" y="220" font-family="system-ui,-apple-system,'PingFang SC',sans-serif" font-size="16" font-weight="500" text-anchor="start" fill="#1d4040">× 4.0 权益乘数</text><text x="470" y="285" font-family="system-ui,-apple-system,'PingFang SC',sans-serif" font-size="27" font-weight="650" text-anchor="start" fill="#bc7443">= 30% ROE</text><text x="420" y="375" font-family="system-ui,-apple-system,'PingFang SC',sans-serif" font-size="15" font-weight="500" text-anchor="middle" fill="#1d4040">应继续检查债务成本、期限、利息保障与现金流承压能力</text></svg>