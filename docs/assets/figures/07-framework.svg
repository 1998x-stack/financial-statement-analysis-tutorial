<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 420" role="img" aria-labelledby="f07framework-title f07framework-desc"><title id="f07framework-title">策略、会计、财务和前瞻四视角框架</title><desc id="f07framework-desc">由商业策略分析到会计判断再到财务比率与现金，再进入前瞻情景的四个视角，源自 Palepu Healy 教材的框架</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6" fill="none" stroke="#147f79" stroke-width="1.5"/></marker></defs><rect width="840" height="420" rx="16" fill="#fffefa"/><text x="28" y="44" text-anchor="start" font-family="system-ui, sans-serif" font-size="21" font-weight="650" fill="#183c3a">先理解商业模式，再解释报表数字</text><rect x="26" y="99" width="176" height="196" rx="10" fill="#fffefa" stroke="#147f79" stroke-width="1.7"/><rect x="44" y="115" width="57" height="43" rx="10" fill="#147f79" stroke="#147f79" stroke-width="1.7"/><text x="72" y="143" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" font-weight="650" fill="#fff">01</text><text x="44" y="196" text-anchor="start" font-family="system-ui, sans-serif" font-size="20" font-weight="650" fill="#147f79">策略分析</text><text x="44" y="238" text-anchor="start" font-family="system-ui, sans-serif" font-size="14" font-weight="500" fill="#4e6866">行业 / 客户 / 竞争</text><path d="M202 199 L226 199" fill="none" stroke="#147f79" stroke-width="2" marker-end="url(#arrow)"/><rect x="230" y="99" width="176" height="196" rx="10" fill="#fffefa" stroke="#7963aa" stroke-width="1.7"/><rect x="248" y="115" width="57" height="43" rx="10" fill="#7963aa" stroke="#7963aa" stroke-width="1.7"/><text x="276" y="143" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" font-weight="650" fill="#fff">02</text><text x="248" y="196" text-anchor="start" font-family="system-ui, sans-serif" font-size="20" font-weight="650" fill="#7963aa">会计分析</text><text x="248" y="238" text-anchor="start" font-family="system-ui, sans-serif" font-size="14" font-weight="500" fill="#4e6866">确认 / 估计 / 可比</text><path d="M406 199 L430 199" fill="none" stroke="#147f79" stroke-width="2" marker-end="url(#arrow)"/><rect x="434" y="99" width="176" height="196" rx="10" fill="#fffefa" stroke="#bb7545" stroke-width="1.7"/><rect x="452" y="115" width="57" height="43" rx="10" fill="#bb7545" stroke="#bb7545" stroke-width="1.7"/><text x="480" y="143" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" font-weight="650" fill="#fff">03</text><text x="452" y="196" text-anchor="start" font-family="system-ui, sans-serif" font-size="20" font-weight="650" fill="#bb7545">财务分析</text><text x="452" y="238" text-anchor="start" font-family="system-ui, sans-serif" font-size="14" font-weight="500" fill="#4e6866">盈利 / 现金 / 杠杆</text><path d="M610 199 L634 199" fill="none" stroke="#147f79" stroke-width="2" marker-end="url(#arrow)"/><rect x="638" y="99" width="176" height="196" rx="10" fill="#fffefa" stroke="#147f79" stroke-width="1.7"/><rect x="656" y="115" width="57" height="43" rx="10" fill="#147f79" stroke="#147f79" stroke-width="1.7"/><text x="684" y="143" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" font-weight="650" fill="#fff">04</text><text x="656" y="196" text-anchor="start" font-family="system-ui, sans-serif" font-size="20" font-weight="650" fill="#147f79">前瞻分析</text><text x="656" y="238" text-anchor="start" font-family="system-ui, sans-serif" font-size="14" font-weight="500" fill="#4e6866">情景 / 风险 / 估值</text><rect x="88" y="333" width="664" height="52" rx="10" fill="#eff6f1" stroke="#147f79" stroke-width="1.7"/><text x="420" y="366" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="500" fill="#183c3a">每一步都须固定报告期、合并范围、单位和适用准则</text></svg>