<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 420" role="img" aria-labelledby="f11bridge-title f11bridge-desc"><title id="f11bridge-title">报告收入增长由内生增长和并购并表贡献构成</title><desc id="f11bridge-desc">上期同口径收入1000，本期收入1300，其中并购并表新增200，内生增长100；报告增长30%，同口径有机增长10%，并购贡献20个百分点</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6" stroke="#147f79" fill="none" stroke-width="1.5"/></marker></defs><rect width="840" height="420" fill="#fffefa" rx="16"/><text x="28" y="42" font-family="system-ui,-apple-system,'PingFang SC',sans-serif" font-size="21" font-weight="650" text-anchor="start" fill="#1d4040">把“增长 30%”拆成两种来源</text><text x="28" y="72" font-family="system-ui,-apple-system,'PingFang SC',sans-serif" font-size="14" font-weight="500" text-anchor="start" fill="#59736d">教学简化：同币种、同业务边界，无处置与汇率影响</text><rect x="34" y="106" width="210" height="72" rx="10" fill="#edf5f1" stroke="#147f79" stroke-width="1.5"/><text x="52" y="136" font-family="system-ui,-apple-system,'PingFang SC',sans-serif" font-size="16" font-weight="500" text-anchor="start" fill="#59736d">上期收入</text><text x="52" y="162" font-family="system-ui,-apple-system,'PingFang SC',sans-serif" font-size="24" font-weight="650" text-anchor="start" fill="#147f79">1,000</text><path d="M245 142 L302 142" stroke="#147f79" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="308" y="106" width="222" height="72" rx="10" fill="#f1edfa" stroke="#7663a8" stroke-width="1.5"/><text x="326" y="136" font-family="system-ui,-apple-system,'PingFang SC',sans-serif" font-size="16" font-weight="500" text-anchor="start" fill="#59736d">本期有机收入</text><text x="326" y="162" font-family="system-ui,-apple-system,'PingFang SC',sans-serif" font-size="24" font-weight="650" text-anchor="start" fill="#7663a8">1,100</text><path d="M531 142 L588 142" stroke="#147f79" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="594" y="106" width="212" height="72" rx="10" fill="#fbf0e8" stroke="#bc7443" stroke-width="1.5"/><text x="612" y="136" font-family="system-ui,-apple-system,'PingFang SC',sans-serif" font-size="16" font-weight="500" text-anchor="start" fill="#59736d">并购新增并表</text><text x="612" y="162" font-family="system-ui,-apple-system,'PingFang SC',sans-serif" font-size="24" font-weight="650" text-anchor="start" fill="#bc7443">+200</text><rect x="308" y="219" width="498" height="72" rx="10" fill="#eaf4ee" stroke="#147f79" stroke-width="1.5"/><text x="330" y="249" font-family="system-ui,-apple-system,'PingFang SC',sans-serif" font-size="16" font-weight="500" text-anchor="start" fill="#59736d">报告期合并收入</text><text x="330" y="276" font-family="system-ui,-apple-system,'PingFang SC',sans-serif" font-size="25" font-weight="650" text-anchor="start" fill="#147f79">1,300</text><text x="806" y="254" font-family="system-ui,-apple-system,'PingFang SC',sans-serif" font-size="23" font-weight="650" text-anchor="end" fill="#147f79">+30%</text><rect x="34" y="323" width="372" height="70" rx="10" fill="#edf5f1" stroke="#147f79" stroke-width="1.5"/><text x="54" y="352" font-family="system-ui,-apple-system,'PingFang SC',sans-serif" font-size="16" font-weight="500" text-anchor="start" fill="#59736d">有机增长</text><text x="54" y="380" font-family="system-ui,-apple-system,'PingFang SC',sans-serif" font-size="17" font-weight="650" text-anchor="start" fill="#147f79">(1,100 − 1,000) / 1,000 = 10%</text><rect x="434" y="323" width="372" height="70" rx="10" fill="#fbf0e8" stroke="#bc7443" stroke-width="1.5"/><text x="454" y="352" font-family="system-ui,-apple-system,'PingFang SC',sans-serif" font-size="16" font-weight="500" text-anchor="start" fill="#59736d">并购贡献</text><text x="454" y="380" font-family="system-ui,-apple-system,'PingFang SC',sans-serif" font-size="17" font-weight="650" text-anchor="start" fill="#bc7443">200 / 1,000 = +20 个百分点</text></svg>