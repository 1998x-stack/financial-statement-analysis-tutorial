<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 420" role="img" aria-labelledby="f09maturity-title f09maturity-desc"><title id="f09maturity-title">分期到期的负债与经营现金来源需按时间匹配</title><desc id="f09maturity-desc">示意一年内本金300，未来一年预计可动用现金90，经营净流入120，尚有90缺口依赖授信或再融资；这是教学压力测试，时间分布并不均匀</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6" stroke="#147f79" fill="none" stroke-width="1.5"/></marker></defs><rect width="840" height="420" fill="#fffefa" rx="16"/><text x="30" y="43" font-family="system-ui,-apple-system,'PingFang SC',sans-serif" font-size="21" font-weight="650" text-anchor="start" fill="#1d4040">短债风险是“资金何时来、债务何时到期”</text><text x="30" y="72" font-family="system-ui,-apple-system,'PingFang SC',sans-serif" font-size="14" font-weight="500" text-anchor="start" fill="#59736d">教学虚构：一年内到期本金 300 万；仅看年度合计</text><rect x="31" y="101" width="771" height="58" rx="10" fill="#f8efe7" stroke="#bc7443" stroke-width="1.5"/><rect x="31" y="101" width="771" height="58" rx="10" fill="#f8efe7" stroke="#bc7443" stroke-width="1.5"/><text x="54" y="137" font-family="system-ui,-apple-system,'PingFang SC',sans-serif" font-size="20" font-weight="650" text-anchor="start" fill="#bc7443">未来一年到期债务：300</text><rect x="31" y="211" width="231" height="55" rx="10" fill="#147f79" stroke="#147f79" stroke-width="1.5"/><rect x="262" y="211" width="308" height="55" rx="10" fill="#7663a8" stroke="#7663a8" stroke-width="1.5"/><rect x="570" y="211" width="232" height="55" rx="10" fill="#fff9ef" stroke="#bc7443" stroke-width="1.5"/><text x="147" y="244" font-family="system-ui,-apple-system,'PingFang SC',sans-serif" font-size="16" font-weight="500" text-anchor="middle" fill="#fff">可用现金 90</text><text x="416" y="244" font-family="system-ui,-apple-system,'PingFang SC',sans-serif" font-size="16" font-weight="500" text-anchor="middle" fill="#fff">预计经营净流入 120</text><text x="685" y="244" font-family="system-ui,-apple-system,'PingFang SC',sans-serif" font-size="17" font-weight="650" text-anchor="middle" fill="#bc7443">资金缺口 90</text><path d="M420 162 L420 198" stroke="#147f79" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="62" y="307" width="716" height="75" rx="10" fill="#eff6f1" stroke="#147f79" stroke-width="1.5"/><text x="420" y="339" font-family="system-ui,-apple-system,'PingFang SC',sans-serif" font-size="17" font-weight="650" text-anchor="middle" fill="#1d4040">缺口需核对：授信可用额度、担保、还款计划及续借条件</text><text x="420" y="363" font-family="system-ui,-apple-system,'PingFang SC',sans-serif" font-size="14" font-weight="500" text-anchor="middle" fill="#59736d">年度合计覆盖不等于每月覆盖：实际还须编制到期日现金预算</text></svg>