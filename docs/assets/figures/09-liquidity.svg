<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 420" role="img" aria-labelledby="f09liquid-title f09liquid-desc"><title id="f09liquid-title">流动比率、速动比率与现金覆盖率的分母相同，分子逐步收窄</title><desc id="f09liquid-desc">流动资产540、流动负债300，流动比率1.8；剔除存货200和预付40得速动资产300，速动比率1；现金120中受限30，可用现金90对应示例现金覆盖率0.3</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6" stroke="#147f79" fill="none" stroke-width="1.5"/></marker></defs><rect width="840" height="420" fill="#fffefa" rx="16"/><text x="29" y="43" font-family="system-ui,-apple-system,'PingFang SC',sans-serif" font-size="20" font-weight="650" text-anchor="start" fill="#1d4040">同样 300 万的流动负债，三种分子回答不同问题</text><rect x="30" y="88" width="648" height="54" rx="4" fill="#147f79" stroke="#147f79" stroke-width="1.5"/><text x="46" y="123" font-family="system-ui,-apple-system,'PingFang SC',sans-serif" font-size="16" font-weight="500" text-anchor="start" fill="#fff">流动资产 540</text><text x="803" y="123" font-family="system-ui,-apple-system,'PingFang SC',sans-serif" font-size="21" font-weight="650" text-anchor="end" fill="#147f79">1.80 倍</text><rect x="30" y="169" width="360" height="54" rx="4" fill="#7663a8" stroke="#7663a8" stroke-width="1.5"/><text x="46" y="204" font-family="system-ui,-apple-system,'PingFang SC',sans-serif" font-size="16" font-weight="500" text-anchor="start" fill="#fff">速动资产 300</text><text x="803" y="204" font-family="system-ui,-apple-system,'PingFang SC',sans-serif" font-size="21" font-weight="650" text-anchor="end" fill="#7663a8">1.00 倍</text><rect x="30" y="250" width="108" height="54" rx="4" fill="#bc7443" stroke="#bc7443" stroke-width="1.5"/><text x="46" y="285" font-family="system-ui,-apple-system,'PingFang SC',sans-serif" font-size="16" font-weight="500" text-anchor="start" fill="#fff">不受限现金 90</text><text x="803" y="285" font-family="system-ui,-apple-system,'PingFang SC',sans-serif" font-size="21" font-weight="650" text-anchor="end" fill="#bc7443">0.30 倍</text><rect x="40" y="345" width="760" height="51" rx="10" fill="#f6f2e8" stroke="#d7c69f" stroke-width="1.5"/><text x="420" y="377" font-family="system-ui,-apple-system,'PingFang SC',sans-serif" font-size="15" font-weight="500" text-anchor="middle" fill="#1d4040">前提：库存 200、预付等 40、现金 120 其中受限 30；未计可交易证券</text></svg>