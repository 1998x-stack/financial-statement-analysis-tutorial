<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 430" role="img" aria-labelledby="f12fcf-title f12fcf-desc"><title id="f12fcf-title">经营现金流扣除资本开支得到分析者常用FCF代理值</title><desc id="f12fcf-desc">经营现金流110，购建固定资产无形资产等支付70，差额40；该差额并非自动可分配股东的现金，也不等同于FCFF或FCFE</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6" stroke="#147f79" fill="none" stroke-width="1.5"/></marker></defs><rect width="840" height="430" fill="#fffefa" rx="16"/><text x="28" y="43" font-family="system-ui,-apple-system,'PingFang SC',sans-serif" font-size="21" font-weight="650" text-anchor="start" fill="#1d4040">现金流转正，不代表所有投资后仍有充足现金</text><rect x="42" y="105" width="302" height="94" rx="10" fill="#edf5f1" stroke="#147f79" stroke-width="1.5"/><text x="65" y="143" font-family="system-ui,-apple-system,'PingFang SC',sans-serif" font-size="18" font-weight="650" text-anchor="start" fill="#59736d">经营现金流 CFO</text><text x="65" y="180" font-family="system-ui,-apple-system,'PingFang SC',sans-serif" font-size="30" font-weight="650" text-anchor="start" fill="#147f79">110</text><path d="M345 152 L410 152" stroke="#147f79" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="418" y="105" width="175" height="94" rx="10" fill="#fbf0e8" stroke="#bc7443" stroke-width="1.5"/><text x="438" y="143" font-family="system-ui,-apple-system,'PingFang SC',sans-serif" font-size="18" font-weight="650" text-anchor="start" fill="#59736d">资本开支</text><text x="438" y="180" font-family="system-ui,-apple-system,'PingFang SC',sans-serif" font-size="30" font-weight="650" text-anchor="start" fill="#bc7443">−70</text><path d="M594 152 L658 152" stroke="#147f79" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="665" y="105" width="138" height="94" rx="10" fill="#eaf4ee" stroke="#147f79" stroke-width="1.5"/><text x="684" y="143" font-family="system-ui,-apple-system,'PingFang SC',sans-serif" font-size="15" font-weight="500" text-anchor="start" fill="#59736d">FCF 代理值</text><text x="684" y="180" font-family="system-ui,-apple-system,'PingFang SC',sans-serif" font-size="28" font-weight="650" text-anchor="start" fill="#147f79">40</text><rect x="42" y="244" width="356" height="112" rx="10" fill="#f1edfa" stroke="#7663a8" stroke-width="1.5"/><text x="63" y="278" font-family="system-ui,-apple-system,'PingFang SC',sans-serif" font-size="16" font-weight="500" text-anchor="start" fill="#7663a8">维持性资本开支</text><text x="63" y="307" font-family="system-ui,-apple-system,'PingFang SC',sans-serif" font-size="14" font-weight="500" text-anchor="start" fill="#59736d">维持现有产能、合规与安全</text><text x="63" y="334" font-family="system-ui,-apple-system,'PingFang SC',sans-serif" font-size="13" font-weight="500" text-anchor="start" fill="#59736d">无法仅凭现金流量表精确拆分</text><rect x="442" y="244" width="356" height="112" rx="10" fill="#fbf0e8" stroke="#bc7443" stroke-width="1.5"/><text x="463" y="278" font-family="system-ui,-apple-system,'PingFang SC',sans-serif" font-size="16" font-weight="500" text-anchor="start" fill="#bc7443">成长性资本开支</text><text x="463" y="307" font-family="system-ui,-apple-system,'PingFang SC',sans-serif" font-size="14" font-weight="500" text-anchor="start" fill="#59736d">扩产、新产品与新增市场</text><text x="463" y="334" font-family="system-ui,-apple-system,'PingFang SC',sans-serif" font-size="13" font-weight="500" text-anchor="start" fill="#59736d">短期压低FCF，可能形成未来回报</text><text x="420" y="402" font-family="system-ui,-apple-system,'PingFang SC',sans-serif" font-size="15" font-weight="500" text-anchor="middle" fill="#1d4040">FCF = CFO − CapEx；用途、融资与投资回报仍须另行分析</text></svg>