<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 420" role="img" aria-labelledby="s03-title s03-desc"><title id="s03-title">资产与资金来源同为一千万元的结构拆解</title><desc id="s03-desc">示例：资产现金180、应收200、存货120、固定资产450、其他50；负债620、权益380，左右都是1000</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#147f79" stroke-width="1.3"/></marker></defs><style>.label{font:700 19px system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}.detail{font:500 15px system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;fill:#526964}.small{font:600 13px system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;fill:#566e69}.number{font:760 26px system-ui,-apple-system,"PingFang SC",sans-serif}.caption{font:700 14px system-ui,-apple-system,"PingFang SC",sans-serif;fill:#173b3a}</style><rect width="840" height="420" fill="#fffefa" rx="16"/><text x="34" y="44" class="label" fill="#173b3a" text-anchor="start">资产 1,000 = 负债 620 + 权益 380（万元）</text><text x="34" y="83" class="caption" fill="#173b3a" text-anchor="start">资源用途｜资产构成</text><rect x="34" y="111" width="138.96" height="68" fill="#147f79"/><text x="103.48" y="151" class="small" fill="#fff" text-anchor="middle">现金180</text><rect x="172.96" y="111" width="154.4" height="68" fill="#6aa09a"/><text x="250.16000000000003" y="151" class="small" fill="#fff" text-anchor="middle">应收200</text><rect x="327.36" y="111" width="92.64" height="68" fill="#7764aa"/><text x="373.68" y="151" class="small" fill="#fff" text-anchor="middle">存货120</text><rect x="420" y="111" width="347.40000000000003" height="68" fill="#c17b48"/><text x="593.7" y="151" class="small" fill="#fff" text-anchor="middle">固定资产450</text><rect x="767.4000000000001" y="111" width="38.6" height="68" fill="#9a7531"/><text x="34" y="212" class="caption" fill="#173b3a" text-anchor="start">资金来源｜债务与股东权益</text><rect x="34" y="237" width="478.64" height="69" fill="#c17b48"/><rect x="512.64" y="237" width="293.36" height="69" fill="#147f79"/><text x="273" y="278" class="label" fill="#fff" text-anchor="middle">负债 620</text><text x="659" y="278" class="label" fill="#fff" text-anchor="middle">权益 380</text><rect x="34" y="340" width="772" height="46" rx="7" fill="#edf4ef"/><text x="420" y="370" class="caption" fill="#173b3a" text-anchor="middle">两排等宽：两边均为 1,000；资产质量与偿债能力仍需另查</text></svg>