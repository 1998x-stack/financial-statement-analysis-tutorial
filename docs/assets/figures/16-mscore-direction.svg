<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 400" width="840" height="400" role="img" aria-labelledby="t16b d16b">
<title id="t16b">M-Score 八个变量的方向与经验阈值</title>
<desc id="d16b">DSRI、GMI、AQI、SGI、DEPI、TATA、LVGI 数值上升通常推高 M 分数，SGAI 的系数为负因此上升会拉低 M 分数。原文样本下的经验分界为负二点二二与负一点七八，分数高于负二点二二提示需要核查，但它不是法律或监管标准。</desc>
<rect x="0" y="0" width="840" height="400" fill="#fffefa"/>
<text x="30" y="40" font-size="16" font-weight="700" fill="#1c3133">八个变量的方向与系数符号（系数按 Beneish 1999 原文）</text>
<rect x="30" y="60" width="185" height="52" rx="4" fill="#e8f3ef" stroke="#116d69"/>
<text x="122" y="82" text-anchor="middle" font-size="15" font-weight="700" fill="#116d69">DSRI ↑　+0.920</text>
<text x="122" y="102" text-anchor="middle" font-size="14" fill="#1c3133">应收占收入比上升</text>
<rect x="225" y="60" width="185" height="52" rx="4" fill="#e8f3ef" stroke="#116d69"/>
<text x="317" y="82" text-anchor="middle" font-size="15" font-weight="700" fill="#116d69">GMI ↑　+0.528</text>
<text x="317" y="102" text-anchor="middle" font-size="14" fill="#1c3133">毛利率恶化</text>
<rect x="420" y="60" width="185" height="52" rx="4" fill="#e8f3ef" stroke="#116d69"/>
<text x="512" y="82" text-anchor="middle" font-size="15" font-weight="700" fill="#116d69">AQI ↑　+0.404</text>
<text x="512" y="102" text-anchor="middle" font-size="14" fill="#1c3133">软资产占比上升</text>
<rect x="615" y="60" width="195" height="52" rx="4" fill="#e8f3ef" stroke="#116d69"/>
<text x="712" y="82" text-anchor="middle" font-size="15" font-weight="700" fill="#116d69">SGI ↑　+0.892</text>
<text x="712" y="102" text-anchor="middle" font-size="14" fill="#1c3133">收入增长加快</text>
<rect x="30" y="124" width="185" height="52" rx="4" fill="#e8f3ef" stroke="#116d69"/>
<text x="122" y="146" text-anchor="middle" font-size="15" font-weight="700" fill="#116d69">DEPI ↑　+0.115</text>
<text x="122" y="166" text-anchor="middle" font-size="14" fill="#1c3133">折旧率下降</text>
<rect x="225" y="124" width="185" height="52" rx="4" fill="#f9eee5" stroke="#b66a38"/>
<text x="317" y="146" text-anchor="middle" font-size="15" font-weight="700" fill="#b66a38">SGAI ↑　−0.172</text>
<text x="317" y="166" text-anchor="middle" font-size="14" fill="#1c3133">费用率上升拉低 M</text>
<rect x="420" y="124" width="185" height="52" rx="4" fill="#e8f3ef" stroke="#116d69"/>
<text x="512" y="146" text-anchor="middle" font-size="15" font-weight="700" fill="#116d69">TATA ↑　+4.679</text>
<text x="512" y="166" text-anchor="middle" font-size="14" fill="#1c3133">应计占比高</text>
<rect x="615" y="124" width="195" height="52" rx="4" fill="#e8f3ef" stroke="#116d69"/>
<text x="712" y="146" text-anchor="middle" font-size="15" font-weight="700" fill="#116d69">LVGI ↑　−0.327</text>
<text x="712" y="166" text-anchor="middle" font-size="14" fill="#1c3133">杠杆上升（系数为负）</text>
<text x="30" y="212" font-size="15" fill="#577173">TATA 的系数绝对值最大，也最依赖变量定义；不同文献的应计项目口径不同，复算结果不可直接互比。</text>
<rect x="83" y="252" width="377" height="26" rx="3" fill="#e8f3ef"/>
<rect x="460" y="252" width="320" height="26" rx="3" fill="#f9eee5"/>
<line x1="83" y1="276" x2="780" y2="276" stroke="#577173" stroke-width="1.5"/>
<line x1="460" y1="240" x2="460" y2="288" stroke="#b66a38" stroke-width="2"/>
<line x1="524" y1="240" x2="524" y2="288" stroke="#9e493b" stroke-width="2"/>
<text x="83" y="236" font-size="15" fill="#116d69">−4.84</text>
<text x="460" y="236" text-anchor="middle" font-size="15" fill="#b66a38">−2.22</text>
<text x="524" y="236" text-anchor="middle" font-size="15" fill="#9e493b">−1.78</text>
<text x="780" y="236" text-anchor="end" font-size="15" fill="#577173">0</text>
<text x="83" y="304" font-size="15" fill="#116d69">这一侧：未发现明显信号</text>
<text x="470" y="304" font-size="15" fill="#b66a38">这一侧：提示需要核查（越向右信号越强）</text>
<text x="30" y="340" font-size="15" fill="#577173">阈值是原文样本下的经验分界，不是法律或监管标准；误报与漏报同时存在，得分只能用于排序与筛查。</text>
<text x="30" y="368" font-size="15" fill="#577173">模型不包含公司治理、关联交易、资金占用等定性信息，因此不能代替审计、问询与盘点等核查手段。</text>
<text x="30" y="392" font-size="15" fill="#577173">本图为方法示意，未对任何真实公司计算分数。</text>
</svg>
