<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 420" role="img" aria-labelledby="f11sgr-title f11sgr-desc"><title id="f11sgr-title">可持续增长率由留存、盈利与融资假设共同决定</title><desc id="f11sgr-desc">期末权益ROE20%，留存率70%，留存盈利对期初权益形成增长，模型SGR为14%除以86%即16.28%；只有假设稳定时才成立</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6" stroke="#147f79" fill="none" stroke-width="1.5"/></marker></defs><rect width="840" height="420" fill="#fffefa" rx="16"/><text x="28" y="42" font-family="system-ui,-apple-system,'PingFang SC',sans-serif" font-size="21" font-weight="650" text-anchor="start" fill="#1d4040">增长上限不是一个孤立的百分比</text><rect x="34" y="88" width="205" height="78" rx="10" fill="#edf5f1" stroke="#147f79" stroke-width="1.5"/><text x="52" y="119" font-family="system-ui,-apple-system,'PingFang SC',sans-serif" font-size="15" font-weight="500" text-anchor="start" fill="#59736d">ROE（期末权益口径）</text><text x="52" y="150" font-family="system-ui,-apple-system,'PingFang SC',sans-serif" font-size="25" font-weight="650" text-anchor="start" fill="#147f79">20%</text><rect x="318" y="88" width="205" height="78" rx="10" fill="#f1edfa" stroke="#7663a8" stroke-width="1.5"/><text x="336" y="119" font-family="system-ui,-apple-system,'PingFang SC',sans-serif" font-size="15" font-weight="500" text-anchor="start" fill="#59736d">留存率 b</text><text x="336" y="150" font-family="system-ui,-apple-system,'PingFang SC',sans-serif" font-size="25" font-weight="650" text-anchor="start" fill="#7663a8">70%</text><path d="M241 126 L310 126" stroke="#147f79" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="602" y="88" width="205" height="78" rx="10" fill="#fbf0e8" stroke="#bc7443" stroke-width="1.5"/><text x="620" y="119" font-family="system-ui,-apple-system,'PingFang SC',sans-serif" font-size="14" font-weight="500" text-anchor="start" fill="#59736d">留存盈利 / ROE×b</text><text x="620" y="150" font-family="system-ui,-apple-system,'PingFang SC',sans-serif" font-size="25" font-weight="650" text-anchor="start" fill="#bc7443">14%</text><path d="M524 126 L594 126" stroke="#147f79" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M704 167 L704 215" stroke="#147f79" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="205" y="224" width="430" height="84" rx="10" fill="#eaf4ee" stroke="#147f79" stroke-width="1.5"/><text x="420" y="257" font-family="system-ui,-apple-system,'PingFang SC',sans-serif" font-size="18" font-weight="650" text-anchor="middle" fill="#1d4040">SGR = (ROE × b) / (1 − ROE × b)</text><text x="420" y="288" font-family="system-ui,-apple-system,'PingFang SC',sans-serif" font-size="23" font-weight="650" text-anchor="middle" fill="#147f79">14% / 86% = 16.28%</text><rect x="57" y="345" width="726" height="55" rx="10" fill="#f6f3e9" stroke="#d9cba9" stroke-width="1.5"/><text x="420" y="379" font-family="system-ui,-apple-system,'PingFang SC',sans-serif" font-size="15" font-weight="500" text-anchor="middle" fill="#1d4040">前提：利润率、周转率、杠杆和分红政策稳定；无新股融资</text></svg>