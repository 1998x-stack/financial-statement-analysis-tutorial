<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 433" role="img" aria-labelledby="s09-title s09-desc"><title id="s09-title">财报四项数据如何关联到附注证据</title><desc id="s09-desc">从货币资金、应收账款、营业收入和预计负债等报表项目出发，分别核对受限资金、账龄、履约条款与或有事项披露</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#147f79" stroke-width="1.3"/></marker></defs><style>.label{font:700 19px system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}.detail{font:500 15px system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;fill:#526964}.small{font:600 13px system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;fill:#566e69}.number{font:760 26px system-ui,-apple-system,"PingFang SC",sans-serif}.caption{font:700 14px system-ui,-apple-system,"PingFang SC",sans-serif;fill:#173b3a}</style><rect width="840" height="433" fill="#fffefa" rx="16"/><text x="29" y="44" class="label" fill="#173b3a" text-anchor="start">报表中的数字是入口；附注给出限制条件</text><rect x="29" y="82" width="300" height="60" rx="8" fill="#e9f4ef" stroke="#147f79"/><text x="47" y="119" class="label" fill="#173b3a" text-anchor="start">货币资金 240</text><path d="M329 112 L479 112" stroke="#147f79" stroke-width="2.2" fill="none" marker-end="url(#arrow)"/><rect x="29" y="162" width="300" height="60" rx="8" fill="#f1eef9" stroke="#7764aa"/><text x="47" y="199" class="label" fill="#173b3a" text-anchor="start">应收账款 200</text><path d="M329 192 L479 192" stroke="#147f79" stroke-width="2.2" fill="none" marker-end="url(#arrow)"/><rect x="29" y="242" width="300" height="60" rx="8" fill="#e9f4ef" stroke="#147f79"/><text x="47" y="279" class="label" fill="#173b3a" text-anchor="start">营业收入 1,000</text><path d="M329 272 L479 272" stroke="#147f79" stroke-width="2.2" fill="none" marker-end="url(#arrow)"/><rect x="29" y="322" width="300" height="60" rx="8" fill="#f1eef9" stroke="#7764aa"/><text x="47" y="359" class="label" fill="#173b3a" text-anchor="start">预计负债 ？</text><path d="M329 352 L479 352" stroke="#147f79" stroke-width="2.2" fill="none" marker-end="url(#arrow)"/><rect x="478" y="82" width="330" height="60" rx="8" fill="#fff8ea" stroke="#c17b48"/><text x="496" y="119" class="caption" fill="#173b3a" text-anchor="start">受限金额 / 存放银行</text><rect x="478" y="162" width="330" height="60" rx="8" fill="#fff8ea" stroke="#c17b48"/><text x="496" y="199" class="caption" fill="#173b3a" text-anchor="start">账龄 / 坏账准备 / 对手方</text><rect x="478" y="242" width="330" height="60" rx="8" fill="#fff8ea" stroke="#c17b48"/><text x="496" y="279" class="caption" fill="#173b3a" text-anchor="start">履约义务 / 退货条款</text><rect x="478" y="322" width="330" height="60" rx="8" fill="#fff8ea" stroke="#c17b48"/><text x="496" y="359" class="caption" fill="#173b3a" text-anchor="start">担保 / 诉讼 / 未决事项</text></svg>