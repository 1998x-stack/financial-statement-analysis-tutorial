<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 400" role="img" aria-labelledby="s05-title s05-desc"><title id="s05-title">利润表从收入走到毛利与示意经营利润</title><desc id="s05-desc">教学示例：收入1000减营业成本600得到毛利400，再减示意期间费用240得到简化经营结果160；真实中国利润表需加计其他项目</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#147f79" stroke-width="1.3"/></marker></defs><style>.label{font:700 19px system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}.detail{font:500 15px system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;fill:#526964}.small{font:600 13px system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;fill:#566e69}.number{font:760 26px system-ui,-apple-system,"PingFang SC",sans-serif}.caption{font:700 14px system-ui,-apple-system,"PingFang SC",sans-serif;fill:#173b3a}</style><rect width="840" height="400" fill="#fffefa" rx="16"/><text x="30" y="45" class="label" fill="#173b3a" text-anchor="start">示例中的“利润阶梯”，不是法定报表完整格式</text><rect x="33" y="74" width="660" height="48" rx="4" fill="#147f79"/><text x="49" y="104" class="caption" fill="#fff" text-anchor="start">营业收入 1,000</text><path d="M730 122 L730 145" stroke="#147f79" stroke-width="2.2" fill="none" marker-end="url(#arrow)"/><rect x="33" y="145" width="396" height="48" rx="4" fill="#c17b48"/><text x="49" y="175" class="caption" fill="#fff" text-anchor="start">− 营业成本 600</text><path d="M730 193 L730 216" stroke="#147f79" stroke-width="2.2" fill="none" marker-end="url(#arrow)"/><rect x="33" y="216" width="264" height="48" rx="4" fill="#7764aa"/><text x="49" y="246" class="caption" fill="#fff" text-anchor="start">= 毛利 400</text><path d="M730 264 L730 287" stroke="#147f79" stroke-width="2.2" fill="none" marker-end="url(#arrow)"/><rect x="33" y="287" width="158.4" height="48" rx="4" fill="#c17b48"/><text x="49" y="317" class="caption" fill="#fff" text-anchor="start">− 示意费用 240</text><path d="M730 335 L730 358" stroke="#147f79" stroke-width="2.2" fill="none" marker-end="url(#arrow)"/><rect x="33" y="358" width="130" height="48" rx="4" fill="#147f79"/><text x="49" y="388" class="caption" fill="#fff" text-anchor="start">= 简化经营结果 160</text><text x="730" y="110" class="label" fill="#147f79" text-anchor="end">毛利率 40%</text><text x="730" y="181" class="label" fill="#c17b48" text-anchor="end">费用率 24%</text><text x="730" y="252" class="small" fill="#5c7773" text-anchor="end">160 / 1,000</text><text x="730" y="272" class="label" fill="#147f79" text-anchor="end">= 16%</text></svg>