<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 382" role="img" aria-labelledby="s10-title s10-desc"><title id="s10-title">受限资金对短期债务保障程度的影响</title><desc id="s10-desc">示例账面货币资金240万元，受限100万元，可动用140万元，到期短债200万元，现金覆盖率0.70倍；仅是资金压力信号，不代表一定违约</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#147f79" stroke-width="1.3"/></marker></defs><style>.label{font:700 19px system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}.detail{font:500 15px system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;fill:#526964}.small{font:600 13px system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;fill:#566e69}.number{font:760 26px system-ui,-apple-system,"PingFang SC",sans-serif}.caption{font:700 14px system-ui,-apple-system,"PingFang SC",sans-serif;fill:#173b3a}</style><rect width="840" height="382" fill="#fffefa" rx="16"/><text x="30" y="47" class="label" fill="#173b3a" text-anchor="start">现金充裕的错觉：一笔受限资金改变了答案</text><rect x="26" y="99" width="247" height="89" rx="12" fill="#fffdfa" stroke="#147f79" stroke-width="2"/><rect x="26" y="99" width="8" height="89" rx="4" fill="#147f79"/><text x="45" y="129" class="label" fill="#173b3a">报表货币资金</text><text x="45" y="156" class="detail">240 万</text><rect x="298" y="99" width="247" height="89" rx="12" fill="#fffdfa" stroke="#c17b48" stroke-width="2"/><rect x="298" y="99" width="8" height="89" rx="4" fill="#c17b48"/><text x="317" y="129" class="label" fill="#173b3a">受限资金</text><text x="317" y="156" class="detail">−100 万</text><rect x="570" y="99" width="247" height="89" rx="12" fill="#fffdfa" stroke="#7764aa" stroke-width="2"/><rect x="570" y="99" width="8" height="89" rx="4" fill="#7764aa"/><text x="589" y="129" class="label" fill="#173b3a">可动用现金</text><text x="589" y="156" class="detail">140 万</text><path d="M273 143 L291 143" stroke="#147f79" stroke-width="2.2" fill="none" marker-end="url(#arrow)"/><path d="M545 143 L565 143" stroke="#147f79" stroke-width="2.2" fill="none" marker-end="url(#arrow)"/><rect x="60" y="235" width="311" height="102" rx="12" fill="#fff5eb" stroke="#c17b48"/><text x="215" y="265" class="caption" fill="#173b3a" text-anchor="middle">一年内到期债务</text><text x="215" y="312" class="number" fill="#c17b48" text-anchor="middle">200 万</text><rect x="470" y="235" width="311" height="102" rx="12" fill="#e9f4ef" stroke="#147f79"/><text x="626" y="265" class="caption" fill="#173b3a" text-anchor="middle">现金覆盖率（示例）</text><text x="626" y="312" class="number" fill="#147f79" text-anchor="middle">140 / 200 = 0.70</text><path d="M371 286 L464 286" stroke="#147f79" stroke-width="2.2" fill="none" marker-end="url(#arrow)"/></svg>