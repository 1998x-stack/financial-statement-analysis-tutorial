<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 440" role="img" aria-labelledby="s08-title s08-desc"><title id="s08-title">净利润到经营现金流的间接法桥接</title><desc id="s08-desc">教学例子：净利润120，加折旧40，减应收增加70，减存货增加30，加应付增加20，得到经营现金流80</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#147f79" stroke-width="1.3"/></marker></defs><style>.label{font:700 19px system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}.detail{font:500 15px system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;fill:#526964}.small{font:600 13px system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;fill:#566e69}.number{font:760 26px system-ui,-apple-system,"PingFang SC",sans-serif}.caption{font:700 14px system-ui,-apple-system,"PingFang SC",sans-serif;fill:#173b3a}</style><rect width="840" height="440" fill="#fffefa" rx="16"/><text x="30" y="46" class="label" fill="#173b3a" text-anchor="start">为什么净利润 120，经营现金只有 80？</text><rect x="24" y="93" width="153" height="153" rx="11" fill="#fff" stroke="#147f79" stroke-width="2"/><text x="38" y="123" class="small" fill="#147f79" text-anchor="start">01</text><text x="38" y="169" class="caption" fill="#173b3a" text-anchor="start">净利润</text><text x="38" y="210" class="number" fill="#147f79" text-anchor="start">＋120</text><path d="M177 170 L187 170" stroke="#147f79" stroke-width="2.2" fill="none" marker-end="url(#arrow)"/><rect x="188" y="93" width="153" height="153" rx="11" fill="#fff" stroke="#7764aa" stroke-width="2"/><text x="202" y="123" class="small" fill="#7764aa" text-anchor="start">02</text><text x="202" y="169" class="caption" fill="#173b3a" text-anchor="start">折旧/摊销</text><text x="202" y="210" class="number" fill="#7764aa" text-anchor="start">＋40</text><path d="M341 170 L351 170" stroke="#147f79" stroke-width="2.2" fill="none" marker-end="url(#arrow)"/><rect x="352" y="93" width="153" height="153" rx="11" fill="#fff" stroke="#c17b48" stroke-width="2"/><text x="366" y="123" class="small" fill="#c17b48" text-anchor="start">03</text><text x="366" y="169" class="caption" fill="#173b3a" text-anchor="start">应收增加</text><text x="366" y="210" class="number" fill="#c17b48" text-anchor="start">−70</text><path d="M505 170 L515 170" stroke="#147f79" stroke-width="2.2" fill="none" marker-end="url(#arrow)"/><rect x="516" y="93" width="153" height="153" rx="11" fill="#fff" stroke="#c17b48" stroke-width="2"/><text x="530" y="123" class="small" fill="#c17b48" text-anchor="start">04</text><text x="530" y="169" class="caption" fill="#173b3a" text-anchor="start">存货增加</text><text x="530" y="210" class="number" fill="#c17b48" text-anchor="start">−30</text><path d="M669 170 L679 170" stroke="#147f79" stroke-width="2.2" fill="none" marker-end="url(#arrow)"/><rect x="680" y="93" width="153" height="153" rx="11" fill="#fff" stroke="#7764aa" stroke-width="2"/><text x="694" y="123" class="small" fill="#7764aa" text-anchor="start">05</text><text x="694" y="169" class="caption" fill="#173b3a" text-anchor="start">应付增加</text><text x="694" y="210" class="number" fill="#7764aa" text-anchor="start">＋20</text><path d="M420 250 L420 284" stroke="#147f79" stroke-width="2.2" fill="none" marker-end="url(#arrow)"/><rect x="260" y="293" width="319" height="76" rx="10" fill="#e9f4ef" stroke="#147f79" stroke-width="2"/><text x="420" y="324" class="caption" fill="#173b3a" text-anchor="middle">经营净现金流</text><text x="420" y="353" class="number" fill="#147f79" text-anchor="middle">80 万</text><text x="420" y="404" class="small" fill="#5c7773" text-anchor="middle">再减资本支出 90 万 → 示例 FCF = −10 万</text></svg>