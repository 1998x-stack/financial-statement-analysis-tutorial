<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 400" role="img" aria-labelledby="t20m d20m">
<title id="t20m">按公司特征选择估值倍数的决策路径</title>
<desc id="d20m">从盈利是否稳定出发，依次判断资产是否为主要价值来源、是否亏损但收入增长、是否高杠杆或资本密集，对应选择 PE、PB、PS 或 EV/EBITDA；底部提示没有万能倍数，每个倍数都要先修正常见扭曲。</desc>
<rect x="0" y="0" width="840" height="400" fill="#f8f7f2"/>
<text x="40" y="38" font-size="18" font-weight="700" fill="#1a1a1a">选倍数：先看公司特征，再看倍数</text>
<rect x="270" y="60" width="300" height="46" rx="8" fill="#116d69"/>
<text x="420" y="89" font-size="15" fill="#fff" text-anchor="middle">这家公司靠什么衡量价值？</text>
<line x1="420" y1="106" x2="420" y2="128" stroke="#577173" stroke-width="1.5"/>
<line x1="140" y1="128" x2="700" y2="128" stroke="#577173" stroke-width="1.5"/>
<line x1="140" y1="128" x2="140" y2="150" stroke="#577173" stroke-width="1.5"/>
<line x1="327" y1="128" x2="327" y2="150" stroke="#577173" stroke-width="1.5"/>
<line x1="513" y1="128" x2="513" y2="150" stroke="#577173" stroke-width="1.5"/>
<line x1="700" y1="128" x2="700" y2="150" stroke="#577173" stroke-width="1.5"/>
<g>
<rect x="40" y="150" width="200" height="96" rx="8" fill="#e8f3ef" stroke="#116d69"/>
<text x="140" y="176" font-size="15" font-weight="700" fill="#116d69" text-anchor="middle">PE 市盈率</text>
<text x="140" y="202" font-size="12.5" fill="#395253" text-anchor="middle">盈利稳定、周期弱</text>
<text x="140" y="222" font-size="12.5" fill="#9e493b" text-anchor="middle">先分清静态 / TTM / 动态</text>
<text x="140" y="240" font-size="12.5" fill="#9e493b" text-anchor="middle">周期股会“高利润低 PE”</text>
</g>
<g>
<rect x="247" y="150" width="160" height="96" rx="8" fill="#e8f3ef" stroke="#116d69"/>
<text x="327" y="176" font-size="15" font-weight="700" fill="#116d69" text-anchor="middle">PB 市净率</text>
<text x="327" y="202" font-size="12.5" fill="#395253" text-anchor="middle">金融、重资产</text>
<text x="327" y="220" font-size="12.5" fill="#9e493b" text-anchor="middle">先查资产质量：</text>
<text x="327" y="238" font-size="12.5" fill="#9e493b" text-anchor="middle">应收、存货、拨备</text>
</g>
<g>
<rect x="433" y="150" width="160" height="96" rx="8" fill="#e8f3ef" stroke="#116d69"/>
<text x="513" y="176" font-size="15" font-weight="700" fill="#116d69" text-anchor="middle">PS 市销率</text>
<text x="513" y="202" font-size="12.5" fill="#395253" text-anchor="middle">亏损但收入增长</text>
<text x="513" y="220" font-size="12.5" fill="#9e493b" text-anchor="middle">收入也可能被操纵：</text>
<text x="513" y="238" font-size="12.5" fill="#9e493b" text-anchor="middle">总额/净额、关联交易</text>
</g>
<g>
<rect x="619" y="150" width="181" height="96" rx="8" fill="#e8f3ef" stroke="#116d69"/>
<text x="709" y="176" font-size="15" font-weight="700" fill="#116d69" text-anchor="middle">EV/EBITDA</text>
<text x="709" y="202" font-size="12.5" fill="#395253" text-anchor="middle">高杠杆、资本密集</text>
<text x="709" y="220" font-size="12.5" fill="#9e493b" text-anchor="middle">忽略资本支出与</text>
<text x="709" y="238" font-size="12.5" fill="#9e493b" text-anchor="middle">营运资本需求</text>
</g>
<rect x="40" y="286" width="760" height="76" rx="8" fill="#f9eee5" stroke="#b66a38"/>
<text x="60" y="314" font-size="13" font-weight="700" fill="#b66a38">没有万能倍数</text>
<text x="60" y="338" font-size="12.5" fill="#395253">每个倍数在比较前都要先修正常见扭曲：收入确认口径、资产质量、折旧与摊销政策、资本支出与营运资本；</text>
<text x="60" y="356" font-size="12.5" fill="#395253">并且必须回答“相对谁比”——历史自己，还是同业，两者都可能因基本面变化而失效。</text>
</svg>
