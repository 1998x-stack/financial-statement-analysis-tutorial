<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 450" role="img" aria-labelledby="s01-title s01-desc"><title id="s01-title">赊销业务如何在三张报表留下不同痕迹</title><desc id="s01-desc">示例：赊销一百万元，销售成本六十万元，客户尚未付款，忽略税费；资产负债表增加应收一百、减少存货六十、增加权益四十；利润表毛利四十；当期经营现金流零</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#147f79" stroke-width="1.3"/></marker></defs><style>.label{font:700 19px system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}.detail{font:500 15px system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;fill:#526964}.small{font:600 13px system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;fill:#566e69}.number{font:760 26px system-ui,-apple-system,"PingFang SC",sans-serif}.caption{font:700 14px system-ui,-apple-system,"PingFang SC",sans-serif;fill:#173b3a}</style><rect width="840" height="450" fill="#fffefa" rx="16"/><text x="33" y="48" class="label" fill="#173b3a" text-anchor="start">教学虚构：赊销 100 万，存货成本 60 万</text><text x="33" y="77" class="small" fill="#173b3a" text-anchor="start">假设商品控制权已转移、尚未收款、忽略税费和其他交易</text><rect x="270" y="97" width="300" height="66" rx="9" fill="#e9f4ef" stroke="#147f79" stroke-width="2"/><text x="420" y="126" class="label" fill="#173b3a" text-anchor="middle">一笔赊销业务</text><text x="420" y="148" class="small" fill="#5c7773" text-anchor="middle">权责发生制 ≠ 当期收款</text><path d="M420 163 L420 202" stroke="#147f79" stroke-width="2.2" fill="none" marker-end="url(#arrow)"/><path d="M420 202 L140 202" stroke="#147f79" stroke-width="2.2" fill="none" /><path d="M420 202 L700 202" stroke="#147f79" stroke-width="2.2" fill="none" /><path d="M140 202 L140 225" stroke="#147f79" stroke-width="2.2" fill="none" marker-end="url(#arrow)"/><path d="M420 202 L420 225" stroke="#147f79" stroke-width="2.2" fill="none" marker-end="url(#arrow)"/><path d="M700 202 L700 225" stroke="#147f79" stroke-width="2.2" fill="none" marker-end="url(#arrow)"/><rect x="20" y="228" width="245" height="104" rx="12" fill="#fffdfa" stroke="#147f79" stroke-width="2"/><rect x="20" y="228" width="8" height="104" rx="4" fill="#147f79"/><text x="39" y="258" class="label" fill="#173b3a">资产负债表</text><text x="39" y="285" class="detail">应收 +100；存货 −60</text><text x="43" y="313" class="caption" fill="#147f79" text-anchor="start">净资产/权益 +40</text><rect x="295" y="228" width="245" height="104" rx="12" fill="#fffdfa" stroke="#c17b48" stroke-width="2"/><rect x="295" y="228" width="8" height="104" rx="4" fill="#c17b48"/><text x="314" y="258" class="label" fill="#173b3a">利润表</text><text x="314" y="285" class="detail">收入 100；成本 60</text><text x="318" y="313" class="caption" fill="#c17b48" text-anchor="start">毛利 +40</text><rect x="570" y="228" width="245" height="104" rx="12" fill="#fffdfa" stroke="#7764aa" stroke-width="2"/><rect x="570" y="228" width="8" height="104" rx="4" fill="#7764aa"/><text x="589" y="258" class="label" fill="#173b3a">现金流量表</text><text x="589" y="285" class="detail">这笔业务尚未收到现金</text><text x="591" y="313" class="caption" fill="#7764aa" text-anchor="start">本次现金流入 0</text><rect x="26" y="366" width="788" height="53" rx="10" fill="#f3f5ef"/><text x="420" y="398" class="caption" fill="#173b3a" text-anchor="middle">应收账款不是现金；利润增加也不代表银行存款增加</text></svg>