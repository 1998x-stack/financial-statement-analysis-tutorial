<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 425" role="img" aria-labelledby="f14funnel-title f14funnel-desc"><title id="f14funnel-title">可比公司筛选依次匹配商业模式、周期、会计口径和资本结构</title><desc id="f14funnel-desc">行业分类只能形成候选池，需继续核对产品客户、收入结构、地域、周期、会计政策和资本强度，再形成可比组</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6" stroke="#147f79" fill="none" stroke-width="1.5"/></marker></defs><rect width="840" height="425" fill="#fffefa" rx="16"/><text x="28" y="43" font-family="system-ui,-apple-system,'PingFang SC',sans-serif" font-size="21" font-weight="650" text-anchor="start" fill="#1d4040">行业标签只是起点，不是可比性的证明</text><rect x="34" y="104" width="132" height="186" rx="10" fill="#fffdfa" stroke="#147f79" stroke-width="1.5"/><text x="100" y="146" font-family="system-ui,-apple-system,'PingFang SC',sans-serif" font-size="15" font-weight="500" text-anchor="middle" fill="#147f79">01 · 业务模型</text><text x="100" y="194" font-family="system-ui,-apple-system,'PingFang SC',sans-serif" font-size="13" font-weight="500" text-anchor="middle" fill="#59736d">产品、客户、渠道</text><text x="100" y="218" font-family="system-ui,-apple-system,'PingFang SC',sans-serif" font-size="13" font-weight="500" text-anchor="middle" fill="#59736d">、价值链</text><path d="M166 198 L181 198" stroke="#147f79" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="182" y="104" width="132" height="186" rx="10" fill="#fffdfa" stroke="#7663a8" stroke-width="1.5"/><text x="248" y="146" font-family="system-ui,-apple-system,'PingFang SC',sans-serif" font-size="15" font-weight="500" text-anchor="middle" fill="#7663a8">02 · 经营环境</text><text x="248" y="194" font-family="system-ui,-apple-system,'PingFang SC',sans-serif" font-size="13" font-weight="500" text-anchor="middle" fill="#59736d">地域、周期、监管</text><text x="248" y="218" font-family="system-ui,-apple-system,'PingFang SC',sans-serif" font-size="13" font-weight="500" text-anchor="middle" fill="#59736d">、币种</text><path d="M314 198 L329 198" stroke="#147f79" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="330" y="104" width="132" height="186" rx="10" fill="#fffdfa" stroke="#bc7443" stroke-width="1.5"/><text x="396" y="146" font-family="system-ui,-apple-system,'PingFang SC',sans-serif" font-size="15" font-weight="500" text-anchor="middle" fill="#bc7443">03 · 发展阶段</text><text x="396" y="194" font-family="system-ui,-apple-system,'PingFang SC',sans-serif" font-size="13" font-weight="500" text-anchor="middle" fill="#59736d">成长 / 成熟、</text><text x="396" y="218" font-family="system-ui,-apple-system,'PingFang SC',sans-serif" font-size="13" font-weight="500" text-anchor="middle" fill="#59736d">并购与处置</text><path d="M462 198 L477 198" stroke="#147f79" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="478" y="104" width="132" height="186" rx="10" fill="#fffdfa" stroke="#a84e48" stroke-width="1.5"/><text x="544" y="146" font-family="system-ui,-apple-system,'PingFang SC',sans-serif" font-size="15" font-weight="500" text-anchor="middle" fill="#a84e48">04 · 会计口径</text><text x="544" y="194" font-family="system-ui,-apple-system,'PingFang SC',sans-serif" font-size="13" font-weight="500" text-anchor="middle" fill="#59736d">合并范围、准则、</text><text x="544" y="218" font-family="system-ui,-apple-system,'PingFang SC',sans-serif" font-size="13" font-weight="500" text-anchor="middle" fill="#59736d">租赁、一次性项</text><path d="M610 198 L625 198" stroke="#147f79" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="626" y="104" width="132" height="186" rx="10" fill="#fffdfa" stroke="#147f79" stroke-width="1.5"/><text x="692" y="146" font-family="system-ui,-apple-system,'PingFang SC',sans-serif" font-size="15" font-weight="500" text-anchor="middle" fill="#147f79">05 · 资本结构</text><text x="692" y="194" font-family="system-ui,-apple-system,'PingFang SC',sans-serif" font-size="13" font-weight="500" text-anchor="middle" fill="#59736d">资产轻重、杠杆、</text><text x="692" y="218" font-family="system-ui,-apple-system,'PingFang SC',sans-serif" font-size="13" font-weight="500" text-anchor="middle" fill="#59736d">融资模式</text><rect x="116" y="337" width="608" height="57" rx="10" fill="#edf5f1" stroke="#147f79" stroke-width="1.5"/><text x="420" y="373" font-family="system-ui,-apple-system,'PingFang SC',sans-serif" font-size="16" font-weight="500" text-anchor="middle" fill="#1d4040">得到一个有解释边界的 peer set，而不是“全行业平均值”</text></svg>