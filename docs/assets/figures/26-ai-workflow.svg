<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 300" role="img" aria-labelledby="t26w d26w">
<title id="t26w">AI 辅助财报分析的人机分工与验证回路</title>
<desc id="d26w">流程为原始年报与数据经 AI 提取、初筛、生成草稿，再经人工抽样核对回到原文，最后才进入判断与决策；核对环节是 AI 不能跳过的验证回路。</desc>
<rect x="0" y="0" width="840" height="300" fill="#f8f7f2"/>
<text x="40" y="38" font-size="18" font-weight="700" fill="#1a1a1a">AI 负责缩小范围，人负责判断与核对</text>
<g font-size="13.5" text-anchor="middle">
<rect x="30" y="110" width="150" height="70" rx="8" fill="#eef2ed" stroke="#577173"/>
<text x="105" y="140" fill="#1c3133">年报 / 数据源</text>
<text x="105" y="162" fill="#577173" font-size="12.5">原文与附注</text>
<rect x="215" y="110" width="170" height="70" rx="8" fill="#e8f3ef" stroke="#116d69"/>
<text x="300" y="140" fill="#116d69" font-weight="700">AI：提取 / 初筛</text>
<text x="300" y="160" fill="#395253" font-size="12.5">摘要、情感、异常打分</text>
<text x="300" y="174" fill="#395253" font-size="12.5">生草稿（可出错）</text>
<rect x="420" y="110" width="170" height="70" rx="8" fill="#f9eee5" stroke="#b66a38"/>
<text x="505" y="140" fill="#b66a38" font-weight="700">人工：抽样核对</text>
<text x="505" y="160" fill="#395253" font-size="12.5">回到原文核对数字</text>
<text x="505" y="174" fill="#395253" font-size="12.5">定位页码与段落</text>
<rect x="625" y="110" width="185" height="70" rx="8" fill="#eef2ed" stroke="#577173"/>
<text x="717" y="140" fill="#1c3133">判断与决策</text>
<text x="717" y="160" fill="#577173" font-size="12.5">对结果负责的是人</text>
</g>
<g stroke="#116d69" stroke-width="2" fill="none" marker-end="url(#a26)">
<line x1="180" y1="145" x2="213" y2="145"/><line x1="385" y1="145" x2="418" y2="145"/><line x1="590" y1="145" x2="623" y2="145"/>
</g>
<defs><marker id="a26" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#116d69"/></marker></defs>
<path d="M505,180 C505,240 300,240 300,182" fill="none" stroke="#b66a38" stroke-width="2" stroke-dasharray="6 4"/>
<text x="402" y="258" font-size="12.5" fill="#b66a38" text-anchor="middle">不可跳过的验证回路：AI 的每个数字都要能指回原文</text>
<text x="40" y="288" font-size="12.5" fill="#555">图注：AI 加速的是“找线索”这一段，而不是“下结论”这一段；把核对环节删除后，整个流程只剩更快地传递未经核实的数字。</text>
</svg>
